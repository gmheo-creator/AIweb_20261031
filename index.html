<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예비교수자 과정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>/* ── 색상·크기 토큰: 분위기를 바꾸고 싶으면 여기만 고치면 됩니다 ──
 * 슬레이트 블루(차분한 청회색) 비즈니스 톤 · 각진 블록 · 흰색 알약형 버튼
 * (변수 이름의 pink/purple 은 예전 이름일 뿐, 지금 값은 청회색 단계입니다) */
:root {
  --pink-50: #f4f5f8;
  --pink-100: #eaecf3;
  --pink-200: #d6d9e7;
  --pink-300: #b3b9d4;
  --pink-500: #6c739d;
  --purple-100: #e4e7f1;
  --purple-200: #c3c8de;
  --purple-400: #848bb4;
  --purple-600: #3e4572;
  --ink: #1e2235;
  --ink-soft: #5c6073;
  --navy: #14254f; /* 섹션 제목 (진한 남색) */

  --bg: var(--pink-50);
  --surface: #ffffff;
  --border: #e0e2eb;
  --accent: var(--purple-600);
  --accent-soft: var(--pink-500);
  --gradient: linear-gradient(135deg, #4a5180, #737ba7);
  --hero-gradient: linear-gradient(120deg, #4c5482 0%, #6f78a5 48%, #9aa1c6 100%);

  --radius: 6px;
  --radius-sm: 4px;
  --shadow: 0 14px 34px -18px rgba(40, 46, 84, 0.3);
  --header-h: 68px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--header-h) + 12px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Noto Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  line-height: 1.7;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; }
h1, h2, h3 { line-height: 1.3; margin: 0; }

.container { width: min(1120px, 100% - 32px); margin-inline: auto; }

.skip-link {
  position: absolute; left: -9999px; top: 8px;
  background: var(--accent); color: #fff; padding: 8px 14px; border-radius: var(--radius-sm); z-index: 100;
}
.skip-link:focus { left: 8px; }

:focus-visible { outline: 3px solid var(--purple-400); outline-offset: 3px; border-radius: 8px; }

/* ── 헤더 ─────────────────────────────────────────── */
.site-header {
  position: sticky; top: 0; z-index: 50;
  background: rgba(246, 247, 250, 0.82);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid transparent;
  transition: border-color .2s, box-shadow .2s;
}
.site-header.scrolled { border-color: var(--border); box-shadow: 0 6px 20px -14px rgba(52, 58, 100, .35); }

.header-inner {
  width: min(1120px, 100% - 32px); margin-inline: auto;
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand-mark {
  width: 40px; height: 40px; display: grid; place-items: center;
  background: var(--gradient); border-radius: var(--radius-sm);
  color: #fff; font-size: 14px; font-weight: 800; letter-spacing: .06em;
}
.brand-mark.has-img { background: #fff; border: 1px solid var(--border); overflow: hidden; }
.brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 17px; font-weight: 800; }
.brand-text small { font-size: 12px; color: var(--ink-soft); }

.site-nav { display: flex; gap: 2px; margin-left: auto; }
.header-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.admin-lock {
  width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); cursor: pointer;
  display: grid; place-items: center; background: #fff; color: var(--ink-soft); transition: color .2s, background .2s;
}
.admin-lock:hover { color: var(--accent); background: var(--purple-100); }
/* 헤더: 학습자 로그인 / 로그인한 이름 */
.header-user { display: flex; align-items: center; gap: 6px; }
.hu-btn {
  height: 40px; padding: 0 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; background: #fff; color: var(--ink-soft);
  font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; transition: color .2s, background .2s, border-color .2s;
}
.hu-btn:hover { color: var(--accent); background: var(--purple-100); }
.hu-btn.hu-login { background: var(--navy); border-color: var(--navy); color: #fff; font-weight: 700; }
.hu-btn.hu-login:hover { background: var(--purple-600); border-color: var(--purple-600); color: #fff; }
.hu-name {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px 0 4px; border-radius: 999px;
  text-decoration: none; color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap;
}
.hu-name:hover { background: var(--purple-100); }
.hu-avatar {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--navy); color: #fff; font-size: 14px; font-weight: 700;
}
.login-hint { text-align: center; color: var(--ink-soft); margin: 0; line-height: 1.7; }
@media (max-width: 560px) {
  .hu-btn { padding: 0 10px; }
  .hu-login span, .hu-text { display: none; }
  .hu-name { padding: 0 4px; }
}
.site-nav a {
  text-decoration: none; font-weight: 500; font-size: 15px; color: var(--ink-soft); white-space: nowrap;
  padding: 8px 12px; border-radius: var(--radius-sm); transition: background .2s, color .2s;
}
.site-nav a:hover { background: var(--pink-100); color: var(--ink); }
.site-nav a.active { background: var(--purple-100); color: var(--accent); font-weight: 700; }

.menu-toggle {
  display: none; width: 44px; height: 44px; border: 0; border-radius: var(--radius-sm);
  background: var(--pink-100); cursor: pointer; padding: 0;
  flex-direction: column; align-items: center; justify-content: center; gap: 5px;
}
.menu-toggle span { width: 20px; height: 2px; background: var(--ink); border-radius: 2px; transition: transform .25s, opacity .25s; }
.menu-toggle[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.menu-toggle[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.menu-toggle[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* ── 히어로 ───────────────────────────────────────── */
/* 청회색 블록 위 흰 글씨, 건축물 곡선 같은 흰 띠, 왼쪽 흰 세로 띠 */
.hero {
  --strip: 0px;
  position: relative; overflow: hidden;
  padding: 104px 0 160px;
  color: #fff;
  background:
    linear-gradient(90deg, #fff 0 var(--strip), transparent var(--strip)),
    radial-gradient(circle at 108% -18%, transparent 0 34%, rgba(255, 255, 255, .13) 34.2% 41%, transparent 41.2%),
    radial-gradient(circle at 108% -18%, transparent 0 47%, rgba(255, 255, 255, .08) 47.2% 55%, transparent 55.2%),
    radial-gradient(circle at -10% 120%, transparent 0 40%, rgba(255, 255, 255, .07) 40.2% 47%, transparent 47.2%),
    linear-gradient(112deg, transparent 0 28%, rgba(28, 32, 58, .2) 28% 31.5%, transparent 31.5%),
    var(--hero-gradient);
}
.hero::after {
  content: "FUTURE FACULTY PROGRAM";
  position: absolute; left: 0; top: 0; bottom: 0; width: var(--strip);
  display: none; place-items: center;
  writing-mode: vertical-rl; letter-spacing: .45em; font-size: 13px; font-weight: 800; color: var(--ink);
}
.hero-inner { position: relative; text-align: left; max-width: 1120px; }
.hero-inner > * { max-width: 760px; }
/* 제목 그림 — 좁은 화면에서는 제목 위에 작게, 넓은 화면에서는 글 왼쪽 빈 공간에 크게 */
.hero-art { display: block; width: 150px; margin: 0 0 22px; color: #fff; }
.hero-art svg { display: block; width: 100%; height: auto; }
@media (min-width: 1280px) {
  .hero-art {
    position: absolute; right: 790px; top: 50%; transform: translateY(-50%);
    width: min(340px, 37vw - 260px); margin: 0;
  }
}
.eyebrow {
  display: inline-block; margin: 0 0 22px;
  font-size: 13px; font-weight: 800; letter-spacing: .28em; text-transform: uppercase; color: #fff;
  border-bottom: 1px solid rgba(255, 255, 255, .5); padding-bottom: 8px;
}
.hero h1 {
  font-size: clamp(34px, 6.8vw, 68px); font-weight: 700; letter-spacing: .02em; color: #fff;
}
.hero-subtitle { font-size: clamp(19px, 3.2vw, 28px); font-weight: 500; letter-spacing: .04em; margin: 12px 0 18px; color: #fff; }
.hero-desc { color: rgba(255, 255, 255, .86); font-size: clamp(15px, 1.8vw, 17px); margin: 0 0 38px; max-width: 620px; }
.hero-actions .btn { min-width: 168px; }
.btn-lg { padding: 15px 32px; font-size: 16px; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.hero .btn-primary { background: #fff; color: var(--accent); text-shadow: none; box-shadow: 0 12px 28px -12px rgba(20, 24, 45, .5); }
.hero .btn-ghost { background: transparent; color: #fff; border-color: rgba(255, 255, 255, .7); }
.hero .btn-ghost:hover { background: rgba(255, 255, 255, .12); }
@media (min-width: 1001px) {
  .hero { --strip: 13vw; }
  .hero::after { display: grid; }
  .hero-inner > * { margin-left: auto; }
  .hero-inner { text-align: right; }
  .hero-actions { justify-content: flex-end; }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; border-radius: 999px; font-weight: 700; font-size: 16px;
  text-decoration: none; transition: transform .15s, box-shadow .2s, background .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--gradient); color: #fff; box-shadow: var(--shadow); text-shadow: 0 1px 2px rgba(30, 34, 60, .25); }
.btn-ghost { background: #fff; color: var(--accent); border: 1.5px solid var(--purple-200); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

/* 첫 화면 아래 핵심 정보 */
.key-info { position: relative; z-index: 2; margin-top: -84px; }
.key-info-grid {
  margin: 0; display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 18px 40px -18px rgba(52, 58, 100, .35);
}
.key-item { display: flex; gap: 14px; align-items: center; padding: 24px; }
.key-item + .key-item { border-left: 1px dashed var(--border); }
.key-icon {
  flex: none; width: 48px; height: 48px; display: grid; place-items: center; font-size: 22px;
  background: var(--purple-100); border-radius: var(--radius-sm);
}
.key-item dt { font-size: 13px; font-weight: 700; color: var(--accent); }
.key-item dd { margin: 0; }
.key-item dd strong { display: block; font-size: 17px; line-height: 1.4; }
.key-item dd small { color: var(--ink-soft); font-size: 13px; }

/* ── 공통 섹션 ────────────────────────────────────── */
.section { padding: 88px 0; }
.section { background: #fff; }
.section-tint { background: var(--pink-50); }
/* 섹션 바탕: 파스텔 푸른색 → 하얀색 → 분홍색 → 노란색 → 초록색 순서로 반복 (index.html 에서 지정)
   각 섹션은 자기 색에서 다음 섹션 색으로 이어지는 그라데이션이라 경계 없이 부드럽게 넘어갑니다. */
:root {
  --bg-blue: #eaf2fd;
  --bg-white: #ffffff;
  --bg-pink: #fdeef3;
  --bg-yellow: #fef8e4;
  --bg-green: #ebf7ef;
}
.bg-blue { background: linear-gradient(180deg, var(--bg-blue), var(--bg-white)); }
.bg-white { background: linear-gradient(180deg, var(--bg-white), var(--bg-pink)); }
.bg-pink { background: linear-gradient(180deg, var(--bg-pink), var(--bg-yellow)); }
.bg-yellow { background: linear-gradient(180deg, var(--bg-yellow), var(--bg-green)); }
.bg-green { background: linear-gradient(180deg, var(--bg-green), var(--bg-blue)); }
/* 제목은 왼쪽 정렬 + 위에 자간 넓은 작은 영문 라벨 */
.section-head { text-align: left; margin-bottom: 40px; }
.section-head h2 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: .01em; color: var(--navy); }
.section-head h2::before {
  content: "FUTURE FACULTY"; display: block; margin-bottom: 8px;
  font-size: 12px; font-weight: 800; letter-spacing: .32em; color: var(--pink-500);
}
.section-head h2::after {
  content: ""; display: block; width: 48px; height: 3px; margin: 16px 0 0;
  background: var(--gradient);
}
.section-head p { color: var(--ink-soft); margin: 14px 0 0; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
  transition: transform .2s, box-shadow .2s;
}
.card:hover { transform: translateY(-3px); box-shadow: 0 20px 40px -18px rgba(40, 46, 84, .4); }

.grid { display: grid; gap: 20px; }
.grid-4 { grid-template-columns: repeat(4, 1fr); }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.grid-2 { grid-template-columns: repeat(2, 1fr); }

/* 프로그램 소개 */
.highlight-icon {
  width: 52px; height: 52px; display: grid; place-items: center; font-size: 26px;
  background: var(--pink-100); border-radius: var(--radius-sm); margin-bottom: 16px;
}
.card h3 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
.card p { margin: 0; color: var(--ink-soft); }

.stat { text-align: center; padding: 30px 20px; }
.stat strong {
  display: block; font-size: clamp(34px, 4.6vw, 48px); font-weight: 800; line-height: 1.2;
  font-variant-numeric: tabular-nums;
  background: linear-gradient(120deg, var(--pink-500), var(--purple-600));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.stat > span { color: var(--ink-soft); font-size: 15px; font-weight: 500; }

/* 장점 슬라이드 */
/* 학습목표 */
.objectives { margin-top: 64px; }
.objectives h3 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
.objectives-lead { color: var(--ink-soft); margin-bottom: 18px; }
.objectives-list { list-style: none; counter-reset: obj; display: grid; gap: 14px; margin: 0; }
.objectives-list li { counter-increment: obj; position: relative; padding-left: 44px; line-height: 1.7; }
.objectives-list li::before {
  content: counter(obj); position: absolute; left: 0; top: 0;
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  background: var(--purple-100); color: var(--accent); font-weight: 800; font-size: 15px;
}
.objectives-list:hover { transform: none; }

/* 학습활동: 3 × 2 카드 */
.activities { margin-top: 64px; }
.activities h3 { font-size: 22px; font-weight: 800; margin-bottom: 18px; }
.activity-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
@media (max-width: 900px) { .activity-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .activity-grid { grid-template-columns: 1fr; } }

.slider { margin-top: 64px; }
.slider-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.slider-head h3 { font-size: 22px; font-weight: 800; }
.slider-controls { display: flex; gap: 8px; }
.slider-btn {
  width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
  border: 1.5px solid var(--purple-200); background: #fff; color: var(--accent);
  font-size: 24px; line-height: 1; display: grid; place-items: center; padding-bottom: 3px;
  transition: background .2s, opacity .2s;
}
.slider-btn:hover:not(:disabled) { background: var(--purple-100); }
.slider-btn:disabled { opacity: .35; cursor: default; }
.slider-track {
  display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 40px) / 3);
  gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 6px 4px 24px; margin: 0 -4px; scrollbar-width: none;
  overscroll-behavior-x: contain;
}
.slider-track::-webkit-scrollbar { display: none; }
.slide { scroll-snap-align: start; }
.slide:hover { transform: none; }
.slide h4, .activity-card h4 { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
.activity-card p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.7; }
.slider-dots { display: flex; justify-content: center; gap: 0; }
/* 점은 작게 보이되, 누르는 영역은 32px 로 넉넉하게 */
.slider-dots button {
  width: 22px; height: 32px; padding: 0; border: 0; cursor: pointer; background: transparent;
  display: grid; place-items: center; transition: width .25s;
}
.slider-dots button::before {
  content: ""; width: 10px; height: 10px; border-radius: 999px; background: var(--pink-200); transition: width .25s, background .25s;
}
.slider-dots button.active { width: 38px; }
.slider-dots button.active::before { width: 26px; background: var(--purple-400); }

/* 주차별 강의 계획 */
.btn-sm { padding: 9px 18px; font-size: 14px; }
.btn-disabled { background: #eceef3; color: #9396a6; cursor: not-allowed; }
.btn-disabled:hover { transform: none; }
.muted { color: var(--ink-soft); margin: 0; font-size: 15px; }

.weeks-head {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  margin: 64px 0 18px;
}
.weeks-head h3 { font-size: 22px; font-weight: 800; }
.weeks-head p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; }
.week-list { display: grid; gap: 12px; }
.week { padding: 0; overflow: hidden; }
.week:hover { transform: none; }
.week.is-past { opacity: .78; }
.week.is-next, .week.is-today { border-color: var(--purple-400); box-shadow: 0 0 0 3px var(--purple-100), var(--shadow); }
.week summary {
  list-style: none; cursor: pointer;
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 16px;
  padding: 16px 20px;
}
.week summary::-webkit-details-marker { display: none; }
.week summary::after {
  content: "+"; width: 28px; height: 28px; display: grid; place-items: center;
  border-radius: 50%; background: var(--purple-100); color: var(--accent); font-weight: 700;
  transition: transform .25s;
}
.week[open] summary::after { transform: rotate(45deg); }
.week-no {
  width: 56px; height: 56px; border-radius: var(--radius-sm); display: grid; place-content: center; text-align: center;
  background: var(--gradient); color: #fff; font-size: 20px; font-weight: 800; line-height: 1.1;
}
.week-no small { display: block; font-size: 11px; font-weight: 500; }
.week.is-past .week-no { background: var(--pink-200); color: var(--ink); }
.week-main { display: flex; flex-direction: column; min-width: 0; }
.week-date { font-size: 13px; color: var(--accent); font-weight: 700; }
.week-main strong { font-size: 17px; }
.week-badges { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.badge {
  display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
}
.badge-past { background: #eceef3; color: #808497; }
.badge-next { background: var(--purple-600); color: #fff; }
.badge-today { background: var(--pink-500); color: #fff; }
.badge-task { background: #fff3d9; color: #9a6a00; }

.week-body { padding: 4px 20px 22px; border-top: 1px dashed var(--border); margin: 0 20px; padding-inline: 0; }
.week-body h4 { font-size: 15px; font-weight: 800; margin: 0 0 6px; color: var(--ink); }
.week-meta {
  display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 16px 0 18px;
}
.week-meta div { display: flex; gap: 8px; }
.week-meta dt { font-weight: 700; color: var(--accent); }
.week-meta dd { margin: 0; }
.week-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.week-cols .topic-list { margin-top: 0; }
.week-cols .topic-list li:first-child { margin-top: 0; }
.video-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.video-list a {
  display: flex; align-items: center; gap: 10px; text-decoration: none;
  padding: 10px 14px; border-radius: var(--radius-sm); background: var(--pink-50); border: 1px solid var(--border);
  font-weight: 500; transition: background .2s;
}
.video-list a:hover { background: var(--pink-100); }
.play {
  flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--pink-500); color: #fff; font-size: 11px; padding-left: 2px;
}

.assignment {
  margin-top: 20px; padding: 18px 20px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, #fff9ec, var(--pink-50)); border: 1px solid #f5e2b8;
}
.assignment-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.assignment-top h4 { margin: 0; }
.assignment p { margin: 8px 0 14px; color: var(--ink-soft); }
.assignment-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.due { font-size: 14px; color: var(--ink-soft); }
.due time { font-weight: 700; color: var(--ink); margin-left: 4px; }

.countdown {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
  border-radius: 999px; font-size: 13px; font-weight: 500; background: #fff; border: 1px solid var(--border);
}
.countdown b { padding: 2px 9px; border-radius: 999px; font-size: 12px; color: #fff; background: var(--purple-400); }
.countdown.soon b { background: #e39a2d; }
.countdown.urgent b { background: #d9486f; }
.countdown.urgent { color: #b8304f; border-color: #f3c3d0; }
.countdown.closed b { background: #a9adbd; }
.countdown.closed { color: #808497; }

/* 수업 일정: 월간 달력 */
.calendar-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
.calendar:hover, .day-panel:hover { transform: none; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.cal-title { font-size: 20px; font-weight: 800; }
.cal-nav {
  width: 40px; height: 40px; border-radius: 50%; cursor: pointer; padding-bottom: 3px;
  border: 1.5px solid var(--purple-200); background: #fff; color: var(--accent); font-size: 22px;
}
.cal-nav:hover { background: var(--purple-100); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-weekdays span { text-align: center; font-size: 13px; font-weight: 700; color: var(--ink-soft); padding: 4px 0; }
.cal-weekdays span:first-child { color: #d9486f; }
.cal-weekdays span:last-child { color: #5b7fd1; }
.cal-day {
  position: relative; aspect-ratio: 1 / 1; min-height: 44px;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  padding: 6px 2px; border: 1px solid transparent; border-radius: var(--radius-sm);
  background: transparent; color: var(--ink); font: inherit; cursor: pointer;
  transition: background .15s, border-color .15s;
}
.cal-day:hover { background: var(--pink-50); border-color: var(--border); }
.cal-day .num { font-size: 15px; font-weight: 500; line-height: 1.4; }
.cal-day.sun .num { color: #d9486f; }
.cal-day.sat .num { color: #5b7fd1; }
.cal-day.has-class { background: linear-gradient(135deg, var(--pink-100), var(--purple-100)); }
.cal-day.has-class .num { font-weight: 800; }
.cal-tag {
  font-size: 11px; font-weight: 700; color: #fff; background: var(--purple-400);
  padding: 1px 6px; border-radius: 999px; white-space: nowrap;
}
.cal-dot {
  position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: #e39a2d;
}
.cal-day.is-today { border: 2px solid var(--pink-500); }
.cal-day.is-selected { background: var(--gradient); }
.cal-day.is-selected .num, .cal-day.is-selected.sun .num, .cal-day.is-selected.sat .num { color: #fff; font-weight: 800; }
.cal-day.is-selected .cal-tag { background: #fff; color: var(--accent); }
.cal-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.cal-legend { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-soft); }
.cal-legend li { display: flex; align-items: center; gap: 6px; }
.cal-legend i { width: 14px; height: 14px; border-radius: 5px; display: inline-block; }
.lg-class { background: linear-gradient(135deg, var(--pink-200), var(--purple-200)); }
.lg-due { background: #e39a2d; border-radius: 50% !important; width: 10px !important; height: 10px !important; }
.lg-today { border: 2px solid var(--pink-500); }

.day-panel { position: sticky; top: calc(var(--header-h) + 16px); }
.panel-date { margin: 0 0 14px; font-weight: 800; font-size: 18px; color: var(--accent); }
.panel-badges { display: flex; gap: 6px; margin-bottom: 8px; }
.panel-week h3 { font-size: 20px; margin-bottom: 10px; }
.panel-meta { margin: 0; display: grid; gap: 4px; }
.panel-meta div { display: flex; gap: 8px; }
.panel-meta dd { margin: 0; }
.panel-task { margin: 14px 0 0 !important; font-size: 14px; color: #9a6a00 !important; font-weight: 500; }
.panel-week .btn { margin-top: 18px; }
.panel-due {
  margin-top: 16px; padding: 14px 16px; border-radius: var(--radius-sm);
  background: #fff9ec; border: 1px solid #f5e2b8;
}
.panel-due p { margin: 6px 0 8px; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.panel-empty { text-align: center; padding: 24px 0 8px; }
.panel-empty > span { font-size: 36px; }
.panel-empty p { margin: 8px 0 12px; }
.link-btn {
  border: 0; background: none; padding: 8px 0; cursor: pointer; font: inherit; font-size: 14px; font-weight: 700;
  color: var(--accent); text-decoration: underline; text-underline-offset: 3px;
}

/* 실습 AI 도구 */
.tool-top { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.tool-top h3 { margin-bottom: 4px; }
.tool-icon {
  flex: none; width: 54px; height: 54px; display: grid; place-items: center; font-size: 26px;
  background: linear-gradient(135deg, var(--pink-100), var(--purple-100)); border-radius: var(--radius-sm);
}

/* 수강 준비물 */
.prep-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 18px; }
.prep-list li { display: flex; gap: 14px; align-items: flex-start; }
.prep-icon {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center; font-size: 20px;
  background: var(--pink-100); border-radius: var(--radius-sm);
}
.prep-list p { margin: 2px 0 0; font-size: 15px; }

/* 커리큘럼 */
.module-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.chip {
  display: inline-block; padding: 4px 12px; border-radius: 999px;
  font-size: 13px; font-weight: 700; background: var(--purple-100); color: var(--accent);
}
.chip-soft { background: var(--pink-100); color: #3e4572; }
.topic-list { list-style: none; padding: 0; margin: 14px 0 0; }
.topic-list li { position: relative; padding-left: 22px; margin-top: 8px; color: var(--ink-soft); }
.topic-list li::before { content: "✿"; position: absolute; left: 0; color: var(--pink-500); font-size: 13px; top: 2px; }

/* 수강 안내 */
.enroll-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.steps { list-style: none; padding: 0; margin: 0; counter-reset: step; }
.steps li { counter-increment: step; position: relative; padding: 0 0 22px 52px; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before {
  content: counter(step); position: absolute; left: 0; top: 0;
  width: 36px; height: 36px; display: grid; place-items: center;
  background: var(--gradient); color: #fff; font-weight: 800; border-radius: 50%;
}
.steps li:not(:last-child)::after {
  content: ""; position: absolute; left: 17px; top: 40px; bottom: 4px; width: 2px; background: var(--pink-200);
}
.steps strong { display: block; }
.steps p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
.card-title { font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.apply { margin-top: 24px; text-align: center; }
.apply small { display: block; margin-top: 10px; color: var(--ink-soft); }

/* 교재 및 참고자료 */
.materials-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.materials-grid li { display: flex; gap: 14px; align-items: flex-start; }
.materials-grid li:hover { transform: none; }
.materials-grid p { margin: 2px 0 0; font-size: 15px; color: var(--ink-soft); }

/* 과제 및 평가 */
.eval-card { display: grid; gap: 22px; }
.eval-card:hover { transform: none; }
.eval-bar { display: flex; height: 34px; border-radius: 999px; overflow: hidden; }
.eval-seg { display: grid; place-items: center; min-width: 0; color: #fff; font-size: 13px; font-weight: 700; }
.eval-c0 { background: #5b74c9; } .eval-c1 { background: #e07ba0; } .eval-c2 { background: #e2aa3b; }
.eval-c3 { background: #4fa77a; } .eval-c4 { background: #8a6fcf; } .eval-c5 { background: #3f9db8; }
.eval-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.eval-list li { display: flex; align-items: center; gap: 14px; padding: 12px 4px; border-bottom: 1px solid var(--border); }
.eval-list li:last-child { border-bottom: 0; }
.eval-dot { flex: none; width: 14px; height: 14px; border-radius: 50%; }
.eval-text { flex: 1; min-width: 0; }
.eval-text p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; }
.eval-pct { flex: none; font-size: 22px; font-weight: 800; color: var(--navy); }
.eval-total { margin: 0; text-align: right; color: var(--ink-soft); }
.eval-total strong { color: var(--navy); }
.eval-total.warn, .eval-total.warn strong { color: #c23a5e; }
.admin-edit-btn { margin-top: 14px; }

/* 실시간 퀴즈 (학습자 공간) */
.quiz-card { margin-bottom: 20px; border-top: 4px solid var(--navy); }
.quiz-card:hover { transform: none; }
.quiz-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.quiz-head .card-title { margin: 0; }
.quiz-live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #c23a5e; }
.quiz-live i { width: 8px; height: 8px; border-radius: 50%; background: #e0466f; animation: quiz-pulse 1.6s infinite; }
@keyframes quiz-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .quiz-live i { animation: none; } }
.quiz-body { margin-top: 14px; }
.quiz-wait { margin: 0; padding: 18px; text-align: center; color: var(--ink-soft); background: var(--pink-50); border-radius: var(--radius-sm); }
.quiz-wait small { display: block; margin-top: 4px; font-size: 13px; }
.quiz-q { margin: 0 0 14px; font-size: 18px; font-weight: 700; color: var(--navy); line-height: 1.6; }
.quiz-badge { display: inline-block; margin-right: 8px; padding: 2px 10px; border-radius: 999px; background: var(--navy); color: #fff; font-size: 13px; vertical-align: 2px; }
.quiz-opts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quiz-opt {
  position: relative; overflow: hidden; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 10px 14px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #fff; font: inherit; color: var(--ink); text-align: left;
}
button.quiz-opt { cursor: pointer; transition: border-color .2s, background .2s; }
button.quiz-opt:hover:not(:disabled) { border-color: var(--purple-400); background: var(--purple-100); }
.qo-no { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--pink-100); font-size: 13px; font-weight: 700; position: relative; }
.qo-text { flex: 1; position: relative; }
.qo-count { flex: none; position: relative; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.qo-bar { position: absolute; inset: 0 auto 0 0; background: rgba(132, 139, 180, .16); transition: width .4s; }
.quiz-opt.picked { border-color: var(--navy); background: var(--purple-100); }
.quiz-opt.correct { border-color: #2f9e64; }
.quiz-opt.correct .qo-bar { background: rgba(47, 158, 100, .18); }
.quiz-opt.correct .qo-no { background: #2f9e64; color: #fff; }
.quiz-opt.wrong { border-color: #d0567a; }
.quiz-opt.wrong .qo-no { background: #d0567a; color: #fff; }
.quiz-msg { margin: 14px 0 0; color: var(--ink-soft); }
.quiz-msg small { margin-left: 6px; }
.quiz-msg.good { color: #2f7d52; font-weight: 700; font-size: 17px; }
.quiz-msg.bad { color: #b03a5e; font-weight: 700; }
.quiz-exp { margin: 10px 0 0; padding: 12px 14px; background: #fef8e4; border-radius: var(--radius-sm); font-size: 15px; line-height: 1.7; }
@media (max-width: 640px) { .quiz-opts { grid-template-columns: 1fr; } }

/* 실시간 퀴즈 (관리자) */
.quiz-admin-item.is-open { border-color: var(--navy); box-shadow: 0 0 0 2px var(--purple-100); }
.qa-bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.qa-bars li { display: grid; grid-template-columns: minmax(0, 1fr) 120px 44px; align-items: center; gap: 10px; font-size: 14px; }
.qa-bars li.is-answer .qa-label { font-weight: 700; color: #2f7d52; }
.qa-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qa-track { height: 10px; border-radius: 999px; background: var(--pink-100); overflow: hidden; }
.qa-track span { display: block; height: 100%; background: var(--purple-400); }
.qa-bars li.is-answer .qa-track span { background: #2f9e64; }
.qa-num { text-align: right; color: var(--ink-soft); }

/* FAQ */
.faq-list { max-width: 820px; margin-inline: 0; display: grid; gap: 14px; }
.faq-item { padding: 0; overflow: hidden; }
.faq-item:hover { transform: none; }
.faq-item summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 20px 24px; font-weight: 700;
}
.faq-item summary::-webkit-details-marker { display: none; }
.faq-item summary::before { content: "Q"; color: var(--pink-500); font-weight: 800; margin-right: 4px; }
.faq-item summary span { flex: 1; }
.faq-item summary::after {
  content: "+"; flex: none; width: 28px; height: 28px; display: grid; place-items: center;
  border-radius: 50%; background: var(--purple-100); color: var(--accent); font-weight: 700;
  transition: transform .25s;
}
.faq-item[open] summary::after { transform: rotate(45deg); }
.faq-item .answer { padding: 0 24px 22px 50px; color: var(--ink-soft); }

/* ── 참여 기능 공통 ───────────────────────────────── */
.section-flush { padding-top: 0; }
.local-note {
  margin: 16px 0 0 !important; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--pink-50); border: 1px dashed var(--pink-300);
  font-size: 13px; color: var(--ink-soft) !important;
}
.btn:disabled { cursor: not-allowed; }
.form-msg { margin: 10px 0 0; font-size: 14px; min-height: 1.4em; color: var(--accent); }
.form-msg.error { color: #c23a5e; }
.req { color: #d9486f; margin-left: 3px; }

/* 입력 칸 */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 0; padding: 0; margin: 0; }
.field > label, .field > legend { font-weight: 700; font-size: 15px; padding: 0; }
.field input:not([type="radio"]):not([type="checkbox"]):not([type="file"]), .field select, .field textarea {
  width: 100%; font: inherit; color: var(--ink);
  padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: #fff;
  transition: border-color .15s, box-shadow .15s;
}
.field textarea { resize: vertical; min-height: 120px; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--purple-400); box-shadow: 0 0 0 4px var(--purple-100);
}
.field.invalid input:not([type="radio"]):not([type="checkbox"]), .field.invalid select, .field.invalid textarea {
  border-color: #e0718f; background: #fff8fa;
}
.field-error { margin: 0; font-size: 13px; color: #c23a5e; font-weight: 500; min-height: 0; }
.field-error:empty { display: none; }
.field-foot { display: flex; justify-content: space-between; gap: 8px; }
.counter { margin-left: auto; font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.counter.ok { color: #2f8a5b; }

.choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; cursor: pointer; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice span {
  display: inline-block; padding: 9px 16px; border-radius: 999px;
  border: 1.5px solid var(--border); background: #fff; font-size: 14px; font-weight: 500;
  transition: background .15s, border-color .15s, color .15s;
}
.choice input:checked + span { background: var(--purple-100); border-color: var(--purple-400); color: var(--accent); font-weight: 700; }
.choice input:focus-visible + span { outline: 3px solid var(--purple-400); outline-offset: 2px; }
.field.invalid .choice span { border-color: #f0b3c4; }
.agree { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 15px; }
.agree input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--purple-600); flex: none; }

/* 투표 */
.poll-layout { display: grid; grid-template-columns: 1fr 1.15fr; gap: 20px; align-items: start; }
.poll-form:hover, .poll-result:hover, .apply-form:hover, .login-card:hover, .student-grid .card:hover, .student-top:hover, .apply-success:hover { transform: none; }
.poll-form fieldset { border: 0; padding: 0; margin: 0 0 16px; }
.poll-options { display: grid; gap: 10px; }
.poll-option {
  position: relative; display: flex; align-items: center; gap: 12px; cursor: pointer;
  padding: 14px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: #fff;
  transition: border-color .15s, background .15s;
}
.poll-option:hover { background: var(--pink-50); }
.poll-option input { width: 18px; height: 18px; accent-color: var(--purple-600); flex: none; margin: 0; }
.poll-option:has(input:checked) { border-color: var(--purple-400); background: var(--purple-100); }
.poll-option:has(input:disabled) { cursor: default; }
.poll-icon { font-size: 20px; }
.poll-label { font-weight: 500; }
.poll-form .btn { width: 100%; }
.poll-result-head { display: flex; align-items: center; justify-content: space-between; }
.poll-result-head .card-title { margin: 0; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #d9486f; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: #d9486f; animation: pulse 1.6s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
.bars { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 16px; }
.bar-label { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 6px; }
.bar-label span { font-weight: 500; }
.bar-label b { white-space: nowrap; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.mine-tag {
  display: none; margin-left: 6px; padding: 1px 8px; border-radius: 999px; font-style: normal;
  font-size: 11px; font-weight: 700; background: var(--purple-600); color: #fff; vertical-align: 1px;
}
.bars li.mine .mine-tag { display: inline-block; }
.bar-track { height: 14px; border-radius: 999px; background: var(--pink-100); overflow: hidden; }
.bar-fill {
  height: 100%; width: 0; border-radius: inherit;
  background: linear-gradient(90deg, var(--pink-300), var(--purple-200));
  transition: width .8s cubic-bezier(.2, .8, .2, 1);
}
.bars li.top .bar-fill { background: linear-gradient(90deg, var(--pink-500), var(--purple-600)); }
.bars li.top .bar-label b { color: var(--accent); }
.poll-total { margin: 18px 0 0; font-size: 14px; color: var(--ink-soft); text-align: right; }

/* 수강 신청서 */
.apply-form { max-width: 880px; margin-inline: auto; padding: 36px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 20px; }
.field-full { grid-column: 1 / -1; }
.form-actions { margin-top: 28px; text-align: center; }
.error-summary {
  margin-bottom: 24px; padding: 16px 20px; border-radius: var(--radius-sm);
  background: #fff1f4; border: 1.5px solid #f0b3c4; color: #9c2747;
}
.error-summary:focus { outline: 3px solid #f0b3c4; outline-offset: 2px; }
.error-summary strong { display: block; margin-bottom: 6px; }
.error-summary ul { margin: 0; padding-left: 18px; }
.error-summary a { color: #9c2747; font-size: 14px; }
.apply-success { max-width: 640px; margin-inline: auto; text-align: center; padding: 40px 32px; }
.success-icon {
  width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
  display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #fff; background: var(--gradient);
}
.apply-success h3 { font-size: 22px; margin-bottom: 6px; }
.apply-success > p { color: var(--ink-soft); }
.success-summary {
  margin: 20px 0 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left;
}
.success-summary div { padding: 10px 14px; border-radius: var(--radius-sm); background: var(--pink-50); }
.success-summary dt { font-size: 12px; color: var(--accent); font-weight: 700; }
.success-summary dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.apply-success .btn { margin-top: 14px; }

/* 학습자 공간 */
.login-card { max-width: 440px; margin-inline: auto; display: grid; gap: 16px; padding: 36px; }
.login-card h3 { text-align: center; font-size: 20px; }
.login-icon { text-align: center; font-size: 36px; }
.login-card .btn { width: 100%; margin-top: 4px; }
.student-top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; padding: 20px 24px; margin-bottom: 20px; }
.student-who { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.student-avatar {
  width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center;
  background: var(--gradient); color: #fff; font-weight: 800; font-size: 20px;
}
.student-who strong { display: block; font-size: 18px; }
.student-who small { color: var(--ink-soft); }
.student-stats { display: flex; gap: 24px; margin: 0; }
.student-stats dt { font-size: 12px; color: var(--ink-soft); font-weight: 700; }
.student-stats dd { margin: 0; font-size: 24px; font-weight: 800; color: var(--accent); line-height: 1.2; }
.student-stats small { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
.student-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.checkin { padding: 18px; border-radius: var(--radius-sm); background: var(--pink-50); text-align: center; margin-bottom: 18px; }
.checkin-state { margin: 0 0 14px; color: var(--ink-soft); }
.checkin-state.open { color: var(--ink); }
.checkin-state.done { color: #2f8a5b; font-weight: 700; }
.checkin .btn { width: 100%; }
.checkin #att-code-err { margin: -4px 0 10px; text-align: left; }
.code-field { text-align: left; margin-bottom: 12px; }
.loading-card { max-width: 440px; margin-inline: auto; text-align: center; color: var(--ink-soft); }
.loading-card:hover { transform: none; }
.loading-card p { margin: 0 0 14px; }
.loading-actions { display: flex; gap: 8px; justify-content: center; }
.att-grid { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.att-grid li {
  display: flex; flex-direction: column; align-items: center; padding: 8px 4px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: #fff; line-height: 1.3;
}
.att-grid b { font-size: 15px; }
.att-grid small { font-size: 11px; color: var(--ink-soft); }
.att-grid .att-present, .att-legend .att-present { background: #e5f6ec; border-color: #b9e3c9; }
.att-grid .att-present small { color: #2f8a5b; font-weight: 700; }
.att-grid .att-late, .att-legend .att-late { background: #fff3d9; border-color: #f5e2b8; }
.att-grid .att-late small { color: #9a6a00; font-weight: 700; }
.att-grid .att-absent, .att-legend .att-absent { background: #f0f1f5; border-color: #dfe1e9; }
.att-grid .att-today { border: 2px solid var(--pink-500); }
.att-legend { margin-top: 12px; }
.att-legend i { border: 1px solid var(--border); }
.att-legend .att-upcoming { background: #fff; }

.upload-form { display: grid; gap: 14px; }
.task-info { font-size: 14px; color: var(--ink-soft); }
.task-info p { margin: 0 0 6px; }
.task-due { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--ink); font-weight: 500; }
.task-done { color: #2f8a5b !important; }
.dropzone {
  position: relative; display: flex; align-items: center; gap: 14px; cursor: pointer;
  padding: 22px 18px; border-radius: var(--radius-sm); border: 2px dashed var(--purple-200); background: #fff;
  transition: background .15s, border-color .15s;
}
.dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.dropzone:hover, .dropzone.drag { background: var(--purple-100); border-color: var(--purple-400); }
.dropzone:focus-within { outline: 3px solid var(--purple-400); outline-offset: 2px; }
.dropzone.has-file { border-style: solid; border-color: var(--purple-400); background: var(--pink-50); }
.dropzone.invalid { border-color: #e0718f; background: #fff8fa; }
.dz-icon { font-size: 26px; }
.dz-text { display: flex; flex-direction: column; min-width: 0; }
.dz-text strong { overflow-wrap: anywhere; }
.dz-text small { color: var(--ink-soft); font-size: 12px; }
.sub-list { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 8px; }
.sub-list li {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border-radius: var(--radius-sm); background: var(--pink-50);
}
.sub-list li > div { min-width: 0; }
.sub-list strong { display: block; font-size: 14px; }
.sub-list small { color: var(--ink-soft); font-size: 12px; overflow-wrap: anywhere; }
.sub-state { flex: none; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #fff; color: var(--ink-soft); }
.sub-done .sub-state { background: #e5f6ec; color: #2f8a5b; }
.sub-late .sub-state { background: #fff3d9; color: #9a6a00; }
.sub-missed .sub-state { background: #f0f1f5; color: #808497; }

/* 안내 팝업 */
.popup {
  width: min(420px, calc(100% - 32px)); padding: 0; border: 0; border-radius: var(--radius);
  background: #fff; color: var(--ink); box-shadow: 0 30px 80px -20px rgba(24, 28, 48, .5);
  overflow: hidden;
}
.popup::backdrop { background: rgba(24, 28, 48, .45); backdrop-filter: blur(3px); }
.popup[open] { animation: pop-in .35s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes pop-in { from { opacity: 0; transform: translateY(16px) scale(.96); } }
.popup-body {
  position: relative; padding: 36px 28px 26px; text-align: center;
  background: radial-gradient(circle at 20% 0%, var(--pink-100), transparent 60%),
              radial-gradient(circle at 100% 30%, var(--purple-100), transparent 55%), #fff;
}
.popup-x {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, .8); font-size: 22px; line-height: 1; cursor: pointer; color: var(--ink-soft);
}
.popup-art { font-size: 44px; }
.popup h2 { font-size: 21px; margin: 8px 0 10px; }
.popup p { margin: 0 0 14px; color: var(--ink-soft); font-size: 15px; }
.popup ul { list-style: none; padding: 0; margin: 0 0 22px; display: grid; gap: 6px; font-size: 14px; font-weight: 500; }
.popup .btn { width: 100%; }
.popup-foot { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--border); }
.popup-foot button {
  border: 0; background: #f6f7fa; padding: 14px; font: inherit; font-size: 14px; color: var(--ink-soft); cursor: pointer;
}
.popup-foot button + button { border-left: 1px solid var(--border); }
.popup-foot button:hover { background: var(--pink-100); color: var(--ink); }
/* 공지 팝업: 긴 글도 읽기 쉽게 왼쪽 정렬, 길면 창 안에서 스크롤 */
.notice-popup .popup-body { text-align: left; max-height: min(70vh, 560px); overflow-y: auto; }
.notice-popup .popup-art, .notice-popup h2 { text-align: center; }
.notice-popup-item { border-top: 1px dashed var(--border); padding-top: 12px; margin-top: 12px; }
.notice-popup-item h3 { font-size: 16px; margin: 0 0 2px; }
.notice-popup-item time { font-size: 13px; color: var(--ink-soft); }
.notice-popup .notice-popup-item p { margin: 6px 0 0; white-space: pre-line; color: var(--ink); }

/* 알림 토스트 · 폭죽 */
.toast {
  position: fixed; left: 50%; bottom: 28px; z-index: 60; transform: translate(-50%, 20px);
  max-width: calc(100% - 32px); padding: 12px 22px; border-radius: 999px;
  background: var(--ink); color: #fff; font-weight: 500; font-size: 15px; text-align: center;
  box-shadow: 0 12px 30px -10px rgba(24, 28, 48, .6);
  opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.fireworks { position: fixed; inset: 0; z-index: 70; pointer-events: none; width: 100%; height: 100%; }

/* ── 공지사항 ─────────────────────────────────────── */
.notice-board { margin-top: 28px; }
.notice-card { padding: 22px 26px; }
.notice-card:hover { transform: none; }
.notice-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.notice-head h2 { font-size: 19px; }
.notice-head span { font-size: 13px; color: var(--ink-soft); }
.notice-list { list-style: none; padding: 0; margin: 0; }
.notice-list li { border-top: 1px dashed var(--border); }
.notice-list summary {
  list-style: none; cursor: pointer; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  padding: 12px 0;
}
.notice-list summary::-webkit-details-marker { display: none; }
.notice-list time, .ap-notice-list time { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
.notice-list p { margin: 0 0 14px; color: var(--ink-soft); white-space: pre-line; }
.notice-tag {
  display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
  background: var(--purple-100); color: var(--accent); white-space: nowrap;
}
.pinned .notice-tag { background: var(--pink-500); color: #fff; }
.notice-pager { display: flex; justify-content: center; gap: 6px; margin-top: 12px; padding-top: 14px; border-top: 1px dashed var(--border); }
.notice-pager button {
  min-width: 34px; height: 34px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: #fff; color: var(--ink-soft); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
}
.notice-pager button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.notice-pager button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.notice-pager button:disabled { opacity: .4; cursor: default; }

.preview-chip {
  position: fixed; left: 16px; bottom: 16px; z-index: 45; max-width: calc(100% - 96px);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: var(--radius-sm); background: #fff8e6; border: 1px solid #f5e2b8;
  font-size: 13px; color: #7a5600; box-shadow: var(--shadow);
}
.preview-chip button { border: 0; background: #7a5600; color: #fff; border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 12px; cursor: pointer; }
.preview-chip button[data-act="publish"] { background: var(--navy); }
/* 저장된 사이트 설정이 새로 바뀌었을 때 알림 */
.update-bar {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 46;
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 999px;
  background: var(--navy); color: #fff; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px);
}
.update-bar button { border: 0; border-radius: 999px; padding: 5px 14px; background: #fff; color: var(--navy); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

/* ── 관리자 로그인 ─────────────────────────────────── */
.admin-login {
  width: min(380px, calc(100% - 32px)); padding: 0; border: 0; border-radius: var(--radius);
  box-shadow: 0 30px 80px -20px rgba(24, 28, 48, .5); color: var(--ink);
}
.admin-login::backdrop, .admin-panel::backdrop { background: rgba(24, 28, 48, .5); backdrop-filter: blur(3px); }
.admin-login-form { padding: 30px 26px 24px; display: grid; gap: 14px; text-align: center; }
.admin-login-form h2 { font-size: 20px; }
.admin-login-form .field { text-align: left; }
.pw-row { display: flex; gap: 6px; }
.pw-row input { flex: 1; }
.pw-toggle { flex: none; border: 1.5px solid var(--border); background: #fff; border-radius: var(--radius-sm); padding: 0 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink-soft); }
.admin-login-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ── 관리자 화면 ───────────────────────────────────── */
.admin-panel {
  width: min(1180px, calc(100% - 32px)); height: min(860px, calc(100% - 32px)); max-width: none; max-height: none;
  padding: 0; border: 0; border-radius: var(--radius); background: var(--bg); color: var(--ink);
  box-shadow: 0 30px 80px -20px rgba(24, 28, 48, .55); overflow: hidden;
}
.admin-panel[open] { display: block; }
.ap-shell { height: 100%; display: grid; grid-template-rows: auto auto auto 1fr; }
.ap-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 22px; background: #fff; border-bottom: 1px solid var(--border);
}
.ap-head h2 { font-size: 19px; }
.ap-mode { display: inline-block; margin-top: 2px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: #fff3d9; color: #9a6a00; }
.ap-mode.on { background: #e5f6ec; color: #2f8a5b; }
.ap-head-actions { display: flex; align-items: center; gap: 8px; }
.ap-x { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--pink-100); font-size: 24px; line-height: 1; cursor: pointer; color: var(--ink); }
.ap-dirty {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 22px;
  background: #fff8e6; border-bottom: 1px solid #f5e2b8; font-size: 14px; color: #7a5600;
}
.ap-dirty[hidden] { display: none; }
.ap-dirty span { margin-right: auto; font-weight: 500; }
.ap-tabs {
  display: flex; gap: 4px; padding: 10px 18px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--border);
  scrollbar-width: thin;
}
.ap-tabs button {
  flex: none; border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  font: inherit; font-size: 14px; font-weight: 500; color: var(--ink-soft); white-space: nowrap;
}
.ap-tabs button:hover { background: var(--pink-100); }
.ap-tabs button[aria-selected="true"] { background: var(--purple-100); color: var(--accent); font-weight: 700; }
.ap-body { overflow: auto; padding: 22px; min-height: 0; }
.ap-body:focus { outline: none; }
.ap-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
.ap-toolbar h3 { font-size: 18px; }
.ap-toolbar-actions, .ap-row-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.ap-help { font-size: 14px; color: var(--ink-soft); margin: 0 0 14px; }
.ap-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; margin-bottom: 16px; display: grid; gap: 12px; }
.ap-card h4 { margin: 0; font-size: 16px; }
.ap-card p { margin: 0; }
.ap-steps { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink-soft); }
.ap-card > .btn, .ap-card > .file-btn { justify-self: start; }
/* AI API 키 */
.ai-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 16px; }
.ai-state { margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--pink-100); color: var(--ink-soft); }
.ai-state.on { background: #e3f4ea; color: #1f7a4a; }
.ai-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.ap-card select { padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font: inherit; background: #fff; }
.ai-try > .btn { justify-self: start; }
.ai-answer { background: var(--pink-50); border-radius: var(--radius-sm); padding: 14px; line-height: 1.7; font-size: 14px; }
.ai-answer small { display: block; color: var(--ink-soft); margin-bottom: 6px; font-weight: 700; }

.ap-loading, .ap-error { text-align: center; padding: 40px 10px; color: var(--ink-soft); }
.ap-error .btn { margin-top: 12px; }
.file-btn { cursor: pointer; }
.danger { color: #c23a5e !important; }
.btn.danger { border-color: #f0b3c4; }
.badge-ok { background: #e5f6ec; color: #2f8a5b; }

.ap-table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #fff; margin-bottom: 14px; max-height: 60vh; }
.ap-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.ap-table th, .ap-table td { padding: 9px 12px; border-bottom: 1px solid #eceef4; text-align: left; white-space: nowrap; }
.ap-table th { position: sticky; top: 0; background: var(--pink-50); font-weight: 700; color: var(--ink); z-index: 1; }
.ap-table tbody tr:hover { background: #f8f9fc; }
.ap-table td.empty { text-align: center; color: var(--ink-soft); padding: 28px; }
.app-table td { white-space: normal; min-width: 90px; max-width: 320px; }
.att-table th, .att-table td { text-align: center; padding: 8px 6px; }
.att-table td:nth-child(-n+2), .att-table th:nth-child(-n+2) { text-align: left; padding-inline: 10px; }
.att-cell { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; font-size: 12px; font-weight: 700; }
.att-cell.ok { background: #e5f6ec; color: #2f8a5b; }
.att-cell.late { background: #fff3d9; color: #9a6a00; }
.att-cell.no { background: #fde7ec; color: #c23a5e; }
.att-cell.future { color: #c3c6d3; }
.ap-tasks { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; margin-bottom: 16px; }
.ap-task { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; display: grid; gap: 2px; }
.ap-task span { font-size: 13px; color: var(--accent); font-weight: 500; }
.ap-task small { font-size: 12px; color: #c23a5e; }

.ap-notice-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ap-notice-list li { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
.ap-notice-list li.empty { justify-content: center; color: var(--ink-soft); }
.ap-notice-list p { margin: 6px 0 0; color: var(--ink-soft); font-size: 14px; white-space: pre-line; }
.notice-form-row { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.notice-form-row .field { flex: 0 1 200px; }
.notice-form-row .btn-primary { margin-left: auto; }
.notice-form-row .btn-ghost + .btn-primary { margin-left: 0; }
.notice-form.is-editing { outline: 2px solid var(--accent); outline-offset: -2px; }
.ap-notice-list li.is-editing { border-color: var(--accent); }
.task-form.is-editing { outline: 2px solid var(--accent); outline-offset: -2px; }
.task-form-row { display: grid; grid-template-columns: 220px 1fr; gap: 14px; }
.task-list time { margin: 0 6px; }
@media (max-width: 640px) { .task-form-row { grid-template-columns: 1fr; } }
.ap-notice-list .notice-tag.is-pin { background: var(--pink-500); color: #fff; }
.ap-notice-list .notice-tag.is-popup { background: var(--purple-100); color: var(--accent); }
.ap-row-actions { flex-wrap: wrap; justify-content: flex-end; }

/* 사이트 편집기 */
.ed-layout { display: grid; grid-template-columns: 190px 1fr; gap: 18px; align-items: start; }
.ed-sections { display: grid; gap: 2px; position: sticky; top: 0; }
.ed-sections button {
  text-align: left; border: 0; background: transparent; padding: 9px 12px; border-radius: var(--radius-sm); cursor: pointer;
  font: inherit; font-size: 14px; color: var(--ink-soft);
}
.ed-sections button:hover { background: var(--pink-100); }
.ed-sections button.active { background: #fff; color: var(--accent); font-weight: 700; box-shadow: 0 0 0 1px var(--border); }
.ed-sections-select { display: none; }
.ed-form { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.ed-form h4 { margin: 0; font-size: 17px; }
.ed-field { display: grid; gap: 4px; }
.ed-field > label, .ed-group > legend { font-size: 13px; font-weight: 700; color: var(--accent); }
.ed-form input[type="text"], .ed-form input[type="number"], .ed-form textarea, .ed-sections-select,
.ap-card input:not([type="checkbox"]):not([type="file"]), .ap-card textarea, .admin-login input {
  width: 100%; font: inherit; font-size: 14px; color: var(--ink); padding: 9px 12px;
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: #fff;
}
.ed-form textarea, .ap-card textarea { resize: vertical; }
.ed-form input:focus, .ed-form textarea:focus, .ap-card input:focus, .ap-card textarea:focus, .admin-login input:focus {
  outline: none; border-color: var(--purple-400); box-shadow: 0 0 0 3px var(--purple-100);
}
.ed-check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
.ed-check input { width: 18px; height: 18px; accent-color: var(--purple-600); }
.ed-group { border: 1px dashed var(--border); border-radius: var(--radius-sm); padding: 10px 12px 12px; margin: 0; display: grid; gap: 10px; min-width: 0; }
.ed-array { display: grid; gap: 8px; }
.ed-item { border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--pink-50); }
.ed-item > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; font-size: 14px; font-weight: 500;
}
.ed-item > summary::-webkit-details-marker { display: none; }
.ed-item > summary::before { content: "▸"; color: var(--accent); transition: transform .2s; }
.ed-item[open] > summary::before { transform: rotate(90deg); }
.ed-item-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ed-item-body { padding: 4px 14px 14px; display: grid; gap: 10px; }
.ed-row { display: flex; gap: 6px; align-items: center; }
.ed-row input { flex: 1; min-width: 0; }
.ed-btns { display: inline-flex; gap: 2px; flex: none; }
.ed-btns button {
  width: 28px; height: 28px; border: 1px solid var(--border); background: #fff; border-radius: 8px; cursor: pointer;
  font-size: 13px; color: var(--ink-soft);
}
.ed-btns button:hover:not(:disabled) { background: var(--purple-100); color: var(--accent); }
.ed-btns button:disabled { opacity: .35; cursor: default; }
.ed-btns button[data-act="del"]:hover { background: #fde7ec; color: #c23a5e; }
.ed-add { justify-self: start; }
.ed-optional { display: flex; flex-wrap: wrap; gap: 6px; }
.ed-photo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ed-photo input[type="text"] { flex: 1 1 200px; }
.ed-photo-thumb { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
.ed-delkey { font-size: 12px; margin-left: 6px; font-weight: 500; }

/* ── 푸터: 교수자 소개 ─────────────────────────────── */
.site-footer {
  background: linear-gradient(160deg, #1e2235, #3c4370);
  color: #e3e5ef; padding: 72px 0 28px;
}
.footer-card {
  display: grid; grid-template-columns: auto 1fr minmax(240px, 300px); gap: 40px; align-items: center;
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12);
  border-radius: var(--radius); padding: 36px;
}
.photo-wrap { flex: none; }
.photo {
  display: block; width: 168px; height: 168px; border-radius: 50%; object-fit: cover;
  box-shadow: 0 0 0 6px rgba(179, 185, 212, .35);
}
.photo-fallback {
  display: grid; place-items: center; background: var(--gradient);
  font-size: 60px; font-weight: 800; color: #fff;
}
.photo-fallback[hidden] { display: none; }
.footer-kicker { margin: 0 0 6px; font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--pink-300); }
.footer-body h2 { font-size: 28px; color: #fff; }
.footer-body h2 span { font-size: 17px; font-weight: 500; color: #c9cde0; margin-left: 4px; }
.affiliation { margin: 4px 0 14px; color: var(--purple-200); }
.name-en { margin: 0 0 14px; color: #dde0ec; font-size: 15px; line-height: 1.6; }
.name-en strong { display: block; margin-bottom: 2px; color: #fff; font-weight: 700; }
.name-en span { display: block; }
.bio { margin: 0 0 14px; color: #dde0ec; }
.career { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.career li {
  font-size: 13px; padding: 5px 12px; border-radius: 999px;
  background: rgba(255, 255, 255, .1); color: #eef0f6;
}
.contacts { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
.contacts li {
  display: flex; gap: 12px; align-items: center;
  padding: 12px 14px; border-radius: var(--radius-sm); background: rgba(255, 255, 255, .08);
}
.contact-icon { flex: none; font-size: 18px; }
.contacts small { display: block; font-size: 12px; color: var(--purple-200); }
.contacts a, .contacts span:not(.contact-icon) { color: #fff; font-weight: 500; overflow-wrap: anywhere; }
.contacts a { text-decoration-color: var(--pink-300); text-underline-offset: 3px; }
.footer-bottom {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px;
  margin-top: 28px; font-size: 13px; color: #a9aec6;
}

/* ── 맨 위로 버튼 ─────────────────────────────────── */
.to-top {
  position: fixed; right: 20px; bottom: 20px; z-index: 40;
  width: 52px; height: 52px; border: 0; border-radius: 50%; cursor: pointer;
  background: var(--gradient); color: #fff; font-size: 22px; font-weight: 700;
  box-shadow: var(--shadow);
  opacity: 0; visibility: hidden; transform: translateY(12px);
  transition: opacity .25s, transform .25s, visibility .25s;
}
.to-top.show { opacity: 1; visibility: visible; transform: none; }
.to-top:hover { transform: translateY(-3px); }

/* ── 반응형 ───────────────────────────────────────── */
@media (max-width: 960px) {
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: repeat(2, 1fr); }
  .enroll-layout, .materials-grid { grid-template-columns: 1fr; }
  .key-info-grid { grid-template-columns: repeat(2, 1fr); }
  .key-item:nth-child(3) { border-left: 0; }
  .key-item:nth-child(n+3) { border-top: 1px dashed var(--border); }
  .slider-track { grid-auto-columns: calc((100% - 20px) / 2); }
  .footer-card { grid-template-columns: auto 1fr; }
  .contacts { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .calendar-layout { grid-template-columns: 1fr; }
  .day-panel { position: static; }
  .poll-layout, .student-grid { grid-template-columns: 1fr; }
}

@media (max-width: 1000px) {
  .menu-toggle { display: flex; }
  .site-nav {
    position: absolute; left: 16px; right: 16px; top: calc(var(--header-h) - 4px);
    flex-direction: column; gap: 2px; padding: 10px;
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    opacity: 0; visibility: hidden; transform: translateY(-8px);
    transition: opacity .2s, transform .2s, visibility .2s;
  }
  .site-nav.open { opacity: 1; visibility: visible; transform: none; }
  .site-nav a { padding: 12px 16px; border-radius: var(--radius-sm); }
}

@media (max-width: 600px) {
  :root { --header-h: 60px; --radius: 6px; }
  .hero { padding: 56px 0 120px; }
  .hero-actions .btn { flex: 1 1 0; min-width: 0; padding-inline: 16px; }
  .section { padding: 64px 0; }
  .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
  .stats.grid-4 { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .stat { padding: 20px 10px; }
  .stat > span { font-size: 13px; }
  .card { padding: 22px; }
  .key-info { margin-top: -80px; }
  .key-item { padding: 16px 14px; gap: 10px; flex-direction: column; align-items: flex-start; }
  .key-icon { width: 40px; height: 40px; font-size: 19px; }
  .key-item dd strong { font-size: 15px; }
  .slider { margin-top: 48px; }
  .slider-track { grid-auto-columns: 86%; gap: 14px; }
  .footer-card { grid-template-columns: 1fr; text-align: center; padding: 28px 20px; gap: 24px; }
  .photo-wrap { justify-self: center; }
  .photo { width: 132px; height: 132px; }
  .career { justify-content: center; }
  .contacts { grid-template-columns: 1fr; text-align: left; }
  .footer-bottom { justify-content: center; text-align: center; }
  .weeks-head { margin-top: 48px; }
  .week summary { grid-template-columns: auto 1fr auto; gap: 12px; padding: 14px; }
  .week-badges { grid-column: 2 / 4; grid-row: 2; justify-content: flex-start; margin-top: -4px; }
  .week-badges:empty { display: none; }
  .week-no { width: 48px; height: 48px; font-size: 18px; border-radius: var(--radius-sm); }
  .week-main strong { font-size: 16px; }
  .week-body { margin: 0 14px; }
  .week-cols { grid-template-columns: 1fr; gap: 18px; }
  .assignment { padding: 16px; }
  .assignment-foot .btn { width: 100%; }
  .calendar { padding: 16px 10px; }
  .cal-head { padding: 0 6px; }
  .cal-grid { gap: 3px; }
  .cal-day { min-height: 0; padding: 4px 1px; border-radius: var(--radius-sm); }
  .cal-day .num { font-size: 14px; }
  .cal-tag { font-size: 10px; padding: 0 3px; letter-spacing: -0.03em; }
  .cal-dot { top: 4px; right: 4px; width: 6px; height: 6px; }
  .cal-foot { padding: 0 6px; }
  .apply-form, .login-card { padding: 24px 18px; }
  .form-grid { grid-template-columns: 1fr; gap: 18px; }
  .success-summary { grid-template-columns: 1fr; }
  .apply-success { padding: 32px 20px; }
  .student-top { padding: 18px; gap: 14px; }
  .student-stats { order: 3; width: 100%; justify-content: space-around; padding-top: 12px; border-top: 1px dashed var(--border); }
  .att-grid { gap: 6px; }
  .toast { bottom: 80px; border-radius: var(--radius-sm); }
  .notice-card { padding: 18px; }
  .notice-list summary { grid-template-columns: auto 1fr; }
  .notice-list time { grid-column: 2; }
  .admin-panel { width: 100%; height: 100%; max-height: 100dvh; border-radius: 0; }
  .ap-head { padding: 12px 14px; }
  .ap-dirty { padding: 10px 14px; }
  .ap-tabs { padding: 8px 10px; }
  .ap-body { padding: 16px 14px; }
  .ed-layout { grid-template-columns: 1fr; }
  .ed-sections { display: none; }
  .ed-sections-select { display: block; font-weight: 700; }
  .ed-form { padding: 14px; }
  .ap-notice-list li { flex-direction: column; }
  .notice-form-row .btn { margin-left: 0; width: 100%; }
  .preview-chip { left: 12px; bottom: 12px; }
  .faq-item summary { padding: 18px; }
  .faq-item .answer { padding: 0 18px 18px 18px; }
  .brand-mark { width: 36px; height: 36px; }
  .to-top { right: 16px; bottom: 16px; width: 48px; height: 48px; }
}
</style>
</head>

  <script data-file="app.js">/*
 * config.js 의 내용을 읽어 화면을 그립니다.
 * 내용 수정은 config.js 에서 하세요. 이 파일은 고칠 필요가 없습니다.
 * (Google 시트 연결 시 저장된 설정을 먼저 받아 온 뒤 실행됩니다 → admin.js 맨 아래 '시작' 부분)
 */
(window.SITE_BOOT = window.SITE_BOOT || []).push(function () {
  "use strict";

  // 관리자 화면에서 고친 설정이 이 브라우저에 미리보기로 저장되어 있으면 그것을 씁니다.
  try {
    const saved = localStorage.getItem("ffp:configOverride");
    if (saved) {
      window.SITE_CONFIG_ORIGINAL = window.SITE_CONFIG;
      window.SITE_CONFIG = JSON.parse(saved);
    }
  } catch { /* 저장소를 쓸 수 없거나 내용이 깨진 경우 원래 설정을 씁니다 */ }

  const C = window.SITE_CONFIG;
  if (!C) {
    document.body.insertAdjacentHTML("afterbegin", "<p style='padding:16px'>config.js 를 불러오지 못했습니다.</p>");
    return;
  }

  // 설정 값에 들어간 글자를 안전하게 HTML 로 바꿉니다.
  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const get = (path) => path.split(".").reduce((o, k) => (o ? o[k] : undefined), C);
  const $ = (sel, root = document) => root.querySelector(sel);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const sectionHead = (heading, lead) =>
    `<div class="section-head"><h2>${esc(heading)}</h2>${lead ? `<p>${esc(lead)}</p>` : ""}</div>`;

  // ── 단순 텍스트 바인딩 ─────────────────────────────
  document.title = `${C.site.title} | ${C.site.organization}`;
  document.querySelectorAll("[data-bind]").forEach((el) => {
    el.textContent = get(el.dataset.bind) ?? "";
  });

  // ── 헤더 로고: 교수자 소개의 그림을 그대로 씁니다 (없으면 'FF' 글자) ──
  const brandMark = $(".brand-mark");
  if (brandMark && C.instructor?.photo) {
    brandMark.innerHTML = `<img src="${esc(C.instructor.photo)}" alt="">`;
    brandMark.classList.add("has-img");
  }

  // ── 메뉴 ──────────────────────────────────────────
  const nav = $("#site-nav");
  nav.innerHTML = C.nav.map((n) => `<a href="#${esc(n.id)}" data-id="${esc(n.id)}">${esc(n.label)}</a>`).join("");

  // ── 첫 화면 버튼 ───────────────────────────────────
  $("#hero-actions").innerHTML = [
    C.site.ctaPrimary && `<a class="btn btn-primary btn-lg" href="${esc(C.site.ctaPrimary.href)}">${esc(C.site.ctaPrimary.label)}</a>`,
    C.site.ctaSecondary && `<a class="btn btn-ghost btn-lg" href="${esc(C.site.ctaSecondary.href)}">${esc(C.site.ctaSecondary.label)}</a>`,
  ].filter(Boolean).join("");

  // ── 핵심 정보 4칸 ──────────────────────────────────
  $("#key-info").innerHTML = `
    <dl class="key-info-grid">
      ${C.keyInfo.map((k) => `
        <div class="key-item">
          <span class="key-icon" aria-hidden="true">${esc(k.icon)}</span>
          <div>
            <dt>${esc(k.label)}</dt>
            <dd><strong>${esc(k.value)}</strong>${k.note ? `<small>${esc(k.note)}</small>` : ""}</dd>
          </div>
        </div>`).join("")}
    </dl>`;

  // ── 프로그램 소개: 통계 + 장점 슬라이드 ─────────────────
  const A = C.about;
  $("#about").innerHTML = `
    <div class="container">
      ${sectionHead(A.heading, A.lead)}
      <div class="grid grid-4 stats">
        ${A.stats.map((s) => `
          <div class="card stat">
            <strong><span class="count" data-to="${Number(s.value) || 0}">${esc(s.value)}</span>${esc(s.suffix)}</strong>
            <span>${esc(s.label)}</span>
          </div>`).join("")}
      </div>

      ${A.objectives && A.objectives.length ? `
        <div class="objectives">
          <h3>${esc(A.objectivesHeading || "학습목표")}</h3>
          ${A.objectivesLead ? `<p class="objectives-lead">${esc(A.objectivesLead)}</p>` : ""}
          <ol class="card objectives-list">
            ${A.objectives.map((o) => `<li>${esc(o)}</li>`).join("")}
          </ol>
        </div>` : ""}

      <div class="activities">
        <h3>${esc(A.benefitsHeading)}</h3>
        <div class="activity-grid">
          ${A.benefits.map((b) => `
            <article class="card activity-card">
              <div class="highlight-icon" aria-hidden="true">${esc(b.icon)}</div>
              <h4>${esc(b.title)}</h4>
              <p>${esc(b.text)}</p>
            </article>`).join("")}
        </div>
      </div>
    </div>`;

  // ── 날짜 계산 도우미 ────────────────────────────────
  const DAY_NAMES = "일월화수목금토";
  const pad = (n) => String(n).padStart(2, "0");
  const dateKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parseDate = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const parseDateTime = (s) => {
    const [ds, ts = "00:00"] = s.trim().split(/\s+/);
    const d = parseDate(ds);
    const [h, mi] = ts.split(":").map(Number);
    d.setHours(h, mi);
    return d;
  };
  const withTime = (d, t) => { const r = new Date(d); const [h, mi] = t.split(":").map(Number); r.setHours(h, mi, 0, 0); return r; };
  const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const fmtDate = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일 (${DAY_NAMES[d.getDay()]})`;
  const fmtDateTime = (d) => `${d.getFullYear()}년 ${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const dayDiff = (a, b) => Math.round((parseDate(dateKey(b)) - parseDate(dateKey(a))) / 864e5);

  // ── 주차별 날짜 자동 계산 ──────────────────────────────
  const K = C.curriculum;
  const S = C.schedule;
  const skip = new Set(S.skipDates || []);
  let cursor = parseDate(S.startDate);
  while (cursor.getDay() !== S.weekday) cursor = addDays(cursor, 1);

  const weeks = K.weeks.map((w, i) => {
    if (w.date) cursor = parseDate(w.date);
    else while (skip.has(dateKey(cursor))) cursor = addDays(cursor, 7);
    const date = cursor;
    cursor = addDays(cursor, 7);
    const startTime = w.startTime || S.startTime;
    const endTime = w.endTime || S.endTime;
    return {
      ...w,
      no: i + 1,
      date,
      key: dateKey(date),
      time: `${startTime} – ${endTime}`,
      start: withTime(date, startTime),
      end: withTime(date, endTime),
      location: w.location || S.location,
      due: w.assignment ? parseDateTime(w.assignment.due) : null,
    };
  });

  const now = new Date();
  const nextWeek = weeks.find((w) => w.end >= now);
  const weekStatus = (w) => {
    if (w.key === dateKey(now)) return { cls: "today", label: "오늘 수업" };
    if (w.end < now) return { cls: "past", label: "지난 수업" };
    if (w === nextWeek) return { cls: "next", label: "다음 수업" };
    return null;
  };

  // 마감까지 남은 시간
  const countdown = (due) => {
    const ms = due - Date.now();
    if (ms <= 0) return { cls: "closed", dday: "마감", text: "마감되었습니다" };
    const d = Math.floor(ms / 864e5);
    const h = Math.floor((ms % 864e5) / 36e5);
    const m = Math.floor((ms % 36e5) / 6e4);
    const days = dayDiff(new Date(), due);
    return {
      cls: ms < 864e5 ? "urgent" : ms < 3 * 864e5 ? "soon" : "open",
      dday: days === 0 ? "D-DAY" : `D-${days}`,
      text: d > 0 ? `${d}일 ${h}시간 남음` : h > 0 ? `${h}시간 ${m}분 남음` : `${Math.max(m, 1)}분 남음`,
    };
  };
  const countdownHTML = (due) => {
    const c = countdown(due);
    return `<span class="countdown ${c.cls}" data-due="${due.getTime()}"><b>${c.dday}</b><span>${c.text}</span></span>`;
  };
  const updateCountdowns = () => {
    document.querySelectorAll(".countdown[data-due]").forEach((el) => {
      const due = new Date(Number(el.dataset.due));
      const c = countdown(due);
      el.className = `countdown ${c.cls}`;
      el.innerHTML = `<b>${c.dday}</b><span>${c.text}</span>`;
      const btn = el.closest(".assignment")?.querySelector(".submit-btn");
      if (btn && c.cls === "closed" && !btn.classList.contains("closed")) {
        btn.outerHTML = `<span class="btn btn-disabled submit-btn closed" aria-disabled="true">제출 마감</span>`;
      }
    });
  };

  const submitButton = (w) => {
    const url = w.assignment.submitUrl || S.submitUrl;
    if (w.due < now) return `<span class="btn btn-disabled submit-btn closed" aria-disabled="true">제출 마감</span>`;
    if (!url) return `<span class="btn btn-disabled submit-btn" aria-disabled="true">제출 링크 준비 중</span>`;
    return `<a class="btn btn-primary submit-btn" href="${esc(url)}" target="_blank" rel="noopener">과제 제출하기</a>`;
  };

  // ── 커리큘럼: 단계 요약 + 주차별 펼쳐 보기 ────────────────
  $("#curriculum").innerHTML = `
    <div class="container">

      </div>

      <div class="weeks-head">
        <div>
          <h3>${esc(K.weeksHeading)}</h3>
          <p>${esc(K.weeksLead)}</p>
        </div>
        <button class="btn btn-ghost btn-sm" type="button" id="toggle-all-weeks">모두 펼치기</button>
      </div>
      <div class="week-list">
        ${weeks.map((w) => {
          const st = weekStatus(w);
          return `
          <details class="card week${st ? ` is-${st.cls}` : ""}" id="week-${w.no}">

                ${st ? `<span class="badge badge-${st.cls}">${st.label}</span>` : ""}

            </summary>
            <div class="week-body">
              <dl class="week-meta">
                <div><dt>📅 날짜</dt><dd>${w.date.getFullYear()}년 ${fmtDate(w.date)}</dd></div>

                <div><dt>📍 장소</dt><dd>${esc(w.location)}</dd></div>

              <div class="week-cols">

                  <h4>학습 내용</h4>

              ${w.assignment ? `
              <div class="assignment">

                  <h4>📝 과제 · ${esc(w.assignment.title)}</h4>

            </div>
          </details>`;
        }).join("")}
      </div>
    </div>`;

  // 다음 수업 주차를 처음부터 펼쳐 둡니다.
  const firstOpen = weeks.find((w) => w.key === dateKey(now)) || nextWeek;

  // ── 수업 일정: 월간 달력 ────────────────────────────
  const classByKey = new Map(weeks.map((w) => [w.key, w]));

  $("#schedule").innerHTML = `
    <div class="container">

      <div class="calendar-layout">
        <div class="card calendar">
          <div class="cal-head">
            <button class="cal-nav" type="button" data-move="-1" aria-label="이전 달">‹</button>
            <h3 class="cal-title" aria-live="polite"></h3>

          <div class="cal-grid cal-days"></div>
          <div class="cal-foot">

      </div>

  const first = weeks[0].date;
  const last = weeks[weeks.length - 1].date;
  const inTerm = now >= first && now <= addDays(last, 7);
  let selected = inTerm ? parseDate(dateKey(now)) : first;
  let view = new Date(selected.getFullYear(), selected.getMonth(), 1);

  const calDays = $(".cal-days");
  const renderCalendar = () => {
