    const lead = view.getDay();
    const total = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    const todayKey = dateKey(now);
    let html = Array.from({ length: lead }, () => `<span class="cal-empty"></span>`).join("");
    for (let d = 1; d <= total; d++) {
      const date = new Date(view.getFullYear(), view.getMonth(), d);
      const k = dateKey(date);
      const w = classByKey.get(k);
      const dues = dueByKey.get(k);
      const cls = [

        w && "has-class",
        dues && "has-due",
        k === todayKey && "is-today",
        k === dateKey(selected) && "is-selected",
        date.getDay() === 0 && "sun",
        date.getDay() === 6 && "sat",
      ].filter(Boolean).join(" ");
      const label = [fmtDate(date), w && `${w.no}주차 수업`, dues && "과제 마감"].filter(Boolean).join(", ");
      html += `
        <button type="button" class="${cls}" data-key="${k}" aria-label="${label}" aria-pressed="${k === dateKey(selected)}">
          <span class="num">${d}</span>
          ${w ? `<span class="cal-tag">${w.no}주차</span>` : ""}
          ${dues ? `<span class="cal-dot" aria-hidden="true"></span>` : ""}
        </button>`;
    }
    calDays.innerHTML = html;
  };

  const renderDay = () => {
    const k = dateKey(selected);
    const w = classByKey.get(k);
    const dues = dueByKey.get(k) || [];
    let html = `<p class="panel-date">${selected.getFullYear()}년 ${fmtDate(selected)}</p>`;
    if (w) {
      const st = weekStatus(w);
      html += `
        <div class="panel-week">
          <div class="panel-badges">
            <span class="chip">${w.no}주차</span>
            ${st ? `<span class="badge badge-${st.cls}">${st.label}</span>` : ""}
          </div>
          <h3>${esc(w.title)}</h3>
          <dl class="panel-meta">
            <div><dt>⏰</dt><dd>${esc(w.time)}</dd></div>
            <div><dt>📍</dt><dd>${esc(w.location)}</dd></div>
          </dl>
          <ul class="topic-list">${w.topics.map((t) => `<li>${esc(t)}</li>`).join("")}</ul>
          ${w.assignment ? `<p class="panel-task">📝 과제: ${esc(w.assignment.title)} · 마감 ${fmtDate(w.due)}</p>` : ""}
          <button class="btn btn-primary btn-sm" type="button" data-open-week="${w.no}">주차 내용 자세히 보기</button>

    }
    dues.forEach((dw) => {
      html += `
        <div class="panel-due">
          <strong>⏳ 과제 마감 · ${esc(dw.assignment.title)}</strong>
          <p>${pad(dw.due.getHours())}:${pad(dw.due.getMinutes())}까지 · ${countdownHTML(dw.due)}</p>
          <button class="link-btn" type="button" data-open-week="${dw.no}">${dw.no}주차 과제 보기 →</button>

    });
    if (!w && !dues.length) {
      const upcoming = weeks.find((x) => x.date > selected);
      html += `
        <div class="panel-empty">
          <span aria-hidden="true">📅</span>
          <p>이날은 수업이 없습니다.</p>
          ${upcoming ? `<button class="link-btn" type="button" data-jump="${upcoming.key}">다음 수업: ${upcoming.no}주차 · ${fmtDate(upcoming.date)} →</button>` : ""}
        </div>`;
    }
    $(".day-panel").innerHTML = html;
  };

  const selectDate = (d) => {
    selected = d;
    if (d.getMonth() !== view.getMonth() || d.getFullYear() !== view.getFullYear()) {
      view = new Date(d.getFullYear(), d.getMonth(), 1);
    }
    renderCalendar();
    renderDay();
  };

  calDays.addEventListener("click", (e) => {
    const b = e.target.closest(".cal-day");
    if (b) selectDate(parseDate(b.dataset.key));
  });
  document.querySelectorAll(".cal-nav").forEach((b) =>
    b.addEventListener("click", () => {
      view = new Date(view.getFullYear(), view.getMonth() + Number(b.dataset.move), 1);
      renderCalendar();
    })
  );
  $("#cal-today").addEventListener("click", () => selectDate(parseDate(dateKey(new Date()))));
  $(".day-panel").addEventListener("click", (e) => {
    const open = e.target.closest("[data-open-week]");
    if (open) openWeek(open.dataset.openWeek);
    const jump = e.target.closest("[data-jump]");
    if (jump) selectDate(parseDate(jump.dataset.jump));
  });

  renderCalendar();
  renderDay();
  setInterval(updateCountdowns, 30000);

  // ── 실습 AI 도구 ──────────────────────────────────
  const T = C.tools;
  $("#tools").innerHTML = `
    <div class="container">
      ${sectionHead(T.heading, T.lead)}
      <div class="grid grid-3">
        ${T.items.map((t) => `
          <article class="card tool">
            <div class="tool-top">
              <span class="tool-icon" aria-hidden="true">${esc(t.icon)}</span>
              <div>
                <h3>${esc(t.name)}</h3>
                <span class="chip chip-soft">${esc(t.category)}</span>
              </div>
            </div>
            <p>${esc(t.text)}</p>
          </article>`).join("")}
      </div>
    </div>`;

  // ── 교재 및 참고자료 ─────────────────────────────────
  // (예전 설정 모양 enroll.prep 도 그대로 읽습니다)
  const M = C.materials || { heading: C.enroll?.prepHeading || "교재 및 참고자료", items: C.enroll?.prep || [] };
  $("#materials").innerHTML = `
    <div class="container">
      ${sectionHead(M.heading, M.lead)}
      <ul class="materials-grid">
        ${(M.items || []).map((p) => `
          <li class="card">
            <span class="prep-icon" aria-hidden="true">${esc(p.icon)}</span>
            <div><strong>${esc(p.title)}</strong><p>${esc(p.text)}</p></div>
          </li>`).join("")}
      </ul>
    </div>`;

  // ── 과제 및 평가 ─────────────────────────────────────
  // (예전 설정 모양 enroll.steps 의 "제목 20%" 도 나눠서 읽습니다)
  const E = C.enroll;
  const evalItems = E.items || (E.steps || []).map((s) => {
    const m = String(s.title).match(/^(.*?)\s*(\d+(?:\.\d+)?)\s*%$/);
    return { title: m ? m[1] : s.title, percent: m ? Number(m[2]) : 0, text: s.text };
  });
  const evalTotal = evalItems.reduce((sum, it) => sum + (Number(it.percent) || 0), 0);
  $("#enroll").innerHTML = `
    <div class="container">
      ${sectionHead(E.items ? E.heading : E.stepsHeading || E.heading, E.items ? E.lead : "")}
      <div class="card eval-card">
        <div class="eval-bar" aria-hidden="true">
          ${evalItems.map((it, i) => `<span class="eval-seg eval-c${i % 6}" style="flex-grow:${Number(it.percent) || 0}">${Number(it.percent) >= 8 ? `${esc(it.percent)}%` : ""}</span>`).join("")}
        </div>
        <ol class="eval-list">
          ${evalItems.map((it, i) => `
            <li>
              <span class="eval-dot eval-c${i % 6}" aria-hidden="true"></span>
              <div class="eval-text"><strong>${esc(it.title)}</strong><p>${esc(it.text)}</p></div>
              <span class="eval-pct">${esc(it.percent)}%</span>
            </li>`).join("")}
        </ol>
        <p class="eval-total${evalTotal === 100 ? "" : " warn"}">합계 <strong>${evalTotal}%</strong>${evalTotal === 100 ? "" : " (100%가 되도록 비율을 맞춰 주세요)"}</p>
      </div>
    </div>`;

  // ── FAQ ──────────────────────────────────────────
  const F = C.faq;
  $("#faq").innerHTML = `
    <div class="container">
      ${sectionHead(F.heading, F.lead)}
      <div class="faq-list">
        ${F.items.map((f) => `
          <details class="card faq-item">
            <summary><span>${esc(f.q)}</span></summary>
            <div class="answer">${esc(f.a)}</div>
          </details>`).join("")}
      </div>
    </div>`;

  // ── 푸터: 교수자 소개 ──────────────────────────────
  const P = C.instructor;
  const Ft = C.footer;
  $("#instructor").innerHTML = `
    <div class="container">
      <div class="footer-card">
        <div class="photo-wrap">
          ${P.photo ? `<img class="photo" src="${esc(P.photo)}" alt="${esc(P.photoAlt || `${P.name} ${P.title} 사진`)}">` : ""}
          <div class="photo photo-fallback" aria-hidden="true"${P.photo ? " hidden" : ""}>${esc(P.name.charAt(0))}</div>
        </div>
        <div class="footer-body">
          <p class="footer-kicker">${esc(P.heading)}</p>
          <h2>${esc(P.name)} <span>${esc(P.title)}</span></h2>
          <p class="affiliation">${esc(P.affiliation)}</p>
          ${P.nameEn || P.affiliationEn?.length ? `
            <p class="name-en">${P.nameEn ? `<strong>${esc(P.nameEn)}</strong>` : ""}${(P.affiliationEn || []).map((l) => `<span>${esc(l)}</span>`).join("")}</p>` : ""}
          ${P.bio ? `<p class="bio">${esc(P.bio)}</p>` : ""}
          ${P.career?.length ? `<ul class="career">${P.career.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
        </div>
        <ul class="contacts">
          ${P.contacts.map((c) => `
            <li>
              <span class="contact-icon" aria-hidden="true">${esc(c.icon)}</span>
              <div>
                <small>${esc(c.label)}</small>
                ${c.href ? `<a href="${esc(c.href)}">${esc(c.value)}</a>` : `<span>${esc(c.value)}</span>`}
              </div>
            </li>`).join("")}
        </ul>
      </div>
      <div class="footer-bottom">
        <span>${esc(Ft.address)}</span>
        <span>${esc(Ft.copyright)}</span>
      </div>
    </div>`;

  // 사진 파일이 없으면 이름 첫 글자로 대신 보여줍니다.
  const photo = $("#instructor img.photo");
  if (photo) {
    photo.addEventListener("error", () => {
      photo.remove();
      $("#instructor .photo-fallback").hidden = false;
    });
  }

  // ── 모바일 메뉴 열고 닫기 ──────────────────────────
  const toggle = $(".menu-toggle");
  const setMenu = (open) => {
    nav.classList.toggle("open", open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
  };
  toggle.addEventListener("click", () => setMenu(!nav.classList.contains("open")));
  nav.addEventListener("click", (e) => { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("click", (e) => { if (!e.target.closest(".site-header")) setMenu(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

  // ── 스크롤: 헤더 그림자, 맨 위로 버튼 ────────────────
  const header = $(".site-header");
  const toTop = $(".to-top");
  const onScroll = () => {
    const y = window.scrollY;
    header.classList.toggle("scrolled", y > 8);
    toTop.classList.toggle("show", y > 500);
  };
  window.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
  toTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" }));

  // ── 현재 보고 있는 섹션의 메뉴 강조 ──────────────────
  const links = [...nav.querySelectorAll("a")];
  const sectionObserver = new IntersectionObserver(
    (entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) {
          links.forEach((a) => a.classList.toggle("active", a.dataset.id === en.target.id));
        }
      });
    },
    { rootMargin: "-45% 0px -50% 0px" }
  );
  C.nav.forEach((n) => { const s = document.getElementById(n.id); if (s) sectionObserver.observe(s); });
  // 페이지 맨 끝(푸터)에 닿으면 마지막 메뉴를 강조합니다.
  window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) {
      links.forEach((a, i) => a.classList.toggle("active", i === links.length - 1));
    }
  }, { passive: true });

  // ── 통계 숫자 올라가는 효과 ─────────────────────────
  const counters = document.querySelectorAll(".count");
  const countUp = (el) => {
    const to = Number(el.dataset.to);
    if (reduceMotion || !to) { el.textContent = to; return; }
    const start = performance.now();
    const dur = 1200;
    const tick = (now) => {
      const t = Math.min((now - start) / dur, 1);
      el.textContent = Math.round(to * (1 - Math.pow(1 - t, 3)));
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  const countObserver = new IntersectionObserver((entries) => {
    entries.forEach((en) => {
      if (en.isIntersecting) { countUp(en.target); countObserver.unobserve(en.target); }
    });
  }, { threshold: 0.6 });
  counters.forEach((el) => { el.textContent = "0"; countObserver.observe(el); });

  // participate.js 에서 함께 쓰는 값과 도우미
  window.SITE = { esc, $, sectionHead, reduceMotion, weeks, dateKey, parseDate, withTime, fmtDate, fmtDateTime, countdownHTML };
});
</script>
  <script data-file="participate.js">/*
 * 수강생 참여 기능: 투표 · 수강 신청서 · 로그인/실시간 퀴즈/출석/과제 제출 · 안내 팝업 · 첫 방문 폭죽
 * 내용 수정은 config.js 에서 하세요. 이 파일은 고칠 필요가 없습니다.
 */
(window.SITE_BOOT = window.SITE_BOOT || []).push(function () {
  "use strict";

  const C = window.SITE_CONFIG;
  const S = window.SITE;
  if (!C || !S) return;
  const { esc, $, sectionHead, reduceMotion, weeks, dateKey, fmtDate, fmtDateTime, countdownHTML } = S;

  // ── 브라우저 저장소 (로그인 상태·내 투표·팝업 숨김 등 개인 설정) ──
  const PREFIX = "ffp:";
  const store = {
    get(key, fallback) {
      try {
        const v = localStorage.getItem(PREFIX + key);
        return v == null ? fallback : JSON.parse(v);
      } catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem(PREFIX + key, JSON.stringify(value)); return true; } catch { return false; }
    },
    remove(key) {
      try { localStorage.removeItem(PREFIX + key); } catch { /* 저장소를 쓸 수 없는 환경 */ }
    },
  };
  // ── 데이터 저장 방식 ─────────────────────────────────
  // mode "local" : 이 브라우저에만 저장 (체험 모드)
  // mode "sheets": Google 시트(Apps Script 웹 앱)에 저장 → 모든 수강생의 데이터가 한곳에 모입니다
  const PC = C.participation || {};
  const sheetsUrl = PC.mode === "sheets" ? String(PC.sheetsUrl || "").trim() : "";
  if (PC.mode === "sheets" && !sheetsUrl) console.warn("config.js 의 participation.sheetsUrl 이 비어 있어 체험 모드로 동작합니다.");
  const isLocal = !sheetsUrl;
  const localNote = (text) =>
    isLocal ? `<p class="local-note">💡 체험 모드: ${esc(text)}</p>` : "";

  const remote = async (action, payload = {}, method = "POST") => {
    const res = method === "GET"
      ? await fetch(`${sheetsUrl}?${new URLSearchParams({ action, ...payload })}`)
      : await fetch(sheetsUrl, { method: "POST", body: JSON.stringify({ action, ...payload }) }); // text/plain 이라 CORS 사전 요청이 없습니다
    if (!res.ok) throw new Error(`서버 응답 오류 (${res.status})`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "요청을 처리하지 못했습니다.");
    return json;
  };

  const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(",")[1] || "");
    r.onerror = () => reject(new Error("파일을 읽지 못했습니다."));
    r.readAsDataURL(file);
  });

  let voterId = store.get("voterId", null);
  if (!voterId) {
    voterId = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(36).slice(2)}`);
    store.set("voterId", voterId);
  }

  // 체험 모드: 관리자가 이 브라우저에 명단을 등록했다면 명단에 있는 학생만 이용할 수 있습니다.
  const checkLocalRoster = (id, name) => {
    const roster = store.get("roster", []);
    if (!roster.length) return;
    const me = roster.find((s) => s.id === String(id).trim());
    if (!me) throw new Error("수강생 명단에 없는 학번입니다. 교수자에게 문의해 주세요.");
    if (name != null && me.name !== String(name).trim()) throw new Error("학번과 이름이 명단과 일치하지 않습니다.");
  };

  // ── 실시간 퀴즈 (체험 모드) ──
  // 진행 상태: quiz:state = { openId, reveal }, 응답: quiz:answers = { 문항id: { 학번: { choice, name, at, correct } } }
  const localQuizState = (id) => {
    const st = store.get("quiz:state", { openId: "", reveal: false });
    const all = store.get("quiz:answers", {});
    const answers = (st.openId && all[st.openId]) || {};
    const counts = {};
    Object.values(answers).forEach((a) => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
    const mine = id && answers[id] ? answers[id].choice : null;
    return { openId: st.openId || "", reveal: Boolean(st.reveal), counts, total: Object.keys(answers).length, mine };
  };

  const columnLabel = (f) => f.sheetLabel || (f.type === "agree" ? "개인정보 동의" : f.label.replace(/\s*\(.*\)\s*$/, ""));

  // 투표·신청서·출석·과제의 읽기/쓰기는 모두 db 를 거칩니다.
  const db = isLocal ? {
    async poll() { return store.get("poll:votes", {}); },
    async vote(option, prev) {
      const v = store.get("poll:votes", {});
      if (prev) v[prev] = Math.max(0, (v[prev] || 0) - 1);
      v[option] = (v[option] || 0) + 1;
      store.set("poll:votes", v);
      return v;
    },
    async apply(data) {
      const list = store.get("applications", []).filter((a) => a.studentId !== data.studentId);
      list.push(data);
      store.set("applications", list);
      return { at: Date.now() };
    },
    async student(id, name) {
      checkLocalRoster(id, name);
      return { attendance: store.get(`attendance:${id}`, {}), submissions: store.get(`submissions:${id}`, {}) };
    },
    async checkin({ id, name, week, lateAfterMinutes }) {
      checkLocalRoster(id, name);
      const at = new Date();
      const late = at > new Date(week.start.getTime() + (lateAfterMinutes || 0) * 6e4);
      const rec = store.get(`attendance:${id}`, {});
      rec[week.no] = { at: at.getTime(), late, name };
      store.set(`attendance:${id}`, rec);
      return { at: at.getTime(), late };
    },
    async submit({ id, name, week, file }) {
      checkLocalRoster(id, name);
      const at = Date.now();
      const late = at > week.due.getTime();
      const subs = store.get(`submissions:${id}`, {});
      subs[week.no] = { fileName: file.name, size: file.size, at, late, name, title: week.assignment.title };
      store.set(`submissions:${id}`, subs);
      return { at, late };
    },
    // ── 관리자 ──
    async notices() { return []; },
    async adminData() {
      const keys = [];
      try { for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i)); } catch { /* 저장소 없음 */ }
      const byPrefix = (p) => keys.filter((k) => k && k.startsWith(PREFIX + p)).map((k) => [k.slice((PREFIX + p).length), store.get(k.slice(PREFIX.length), {})]);
      return {
        applications: store.get("applications", []),
        attendance: byPrefix("attendance:"),
        submissions: byPrefix("submissions:"),
        roster: store.get("roster", []),
      };
    },
    async quizState(id) { return localQuizState(id); },
    async quizAnswer({ id, name, qid, choice, correct }) {
      checkLocalRoster(id, name);
      const st = store.get("quiz:state", {});
      if (st.openId !== qid) throw new Error("지금은 이 문항에 답할 수 없습니다.");
      const all = store.get("quiz:answers", {});
      all[qid] = all[qid] || {};
      if (all[qid][id]) throw new Error("이미 답한 문항입니다.");
      all[qid][id] = { choice, name, at: Date.now(), correct: Boolean(correct) };
      store.set("quiz:answers", all);
      return localQuizState(id);
    },
    async quizControl(_pw, { openId, reveal }) {
      store.set("quiz:state", { openId: openId || "", reveal: Boolean(reveal) });
      return localQuizState();
    },
    async quizResults() {
      const all = store.get("quiz:answers", {});
      const results = {};
      Object.entries(all).forEach(([qid, answers]) => {
        const counts = {};
        Object.values(answers).forEach((a) => { counts[a.choice] = (counts[a.choice] || 0) + 1; });
        results[qid] = { counts, total: Object.keys(answers).length };
      });
      return { state: localQuizState(), results };
    },
    async quizReset(_pw, qid) {
      const all = store.get("quiz:answers", {});
      delete all[qid];
      store.set("quiz:answers", all);
      return {};
    },
    async saveRoster(_pw, roster) { store.set("roster", roster); return { count: roster.length }; },
    async saveNotice() { return {}; },
    async deleteNotice() { return {}; },
    async changeAdminPassword() { return {}; },
  } : {
    async poll() { return (await remote("poll", {}, "GET")).votes; },
    async vote(option) { return (await remote("vote", { voterId, option })).votes; },
    async apply(data) {
      return remote("apply", { data, columns: (C.applyForm?.fields || []).map((f) => ({ name: f.name, label: columnLabel(f) })) });
    },
    async student(id, name) {
      const r = await remote("student", { id, name }, "GET");
      return { attendance: r.attendance || {}, submissions: r.submissions || {} };
    },
    // ── 관리자 (비밀번호는 시트 '설정' 탭의 관리자비밀번호와 비교됩니다) ──
    async notices() { return (await remote("notices", {}, "GET")).notices || []; },
    async adminData(password) { return remote("adminData", { password }); },
    async saveRoster(password, roster) { return remote("saveRoster", { password, roster }); },
    async saveNotice(password, notice) { return remote("saveNotice", { password, notice }); },
    async deleteNotice(password, id) { return remote("deleteNotice", { password, id }); },
    async changeAdminPassword(password, newPassword) { return remote("changeAdminPassword", { password, newPassword }); },
    async saveSiteConfig(password, config) { return remote("saveSiteConfig", { password, config: JSON.stringify(config) }); },
    async clearSiteConfig(password) { return remote("clearSiteConfig", { password }); },
    async quizState(id) { return remote("quizState", id ? { id } : {}, "GET"); },
    async quizAnswer({ id, name, qid, choice, correct }) { return remote("quizAnswer", { id, name, qid, choice, correct: Boolean(correct) }); },
    async quizControl(password, { openId, reveal }) { return remote("quizControl", { password, openId: openId || "", reveal: Boolean(reveal) }); },
    async quizResults(password) { return remote("quizResults", { password }); },
    async quizReset(password, qid) { return remote("quizReset", { password, qid }); },
    async checkin({ id, name, week, code, openBeforeMinutes, lateAfterMinutes, alwaysOpen }) {
      return remote("checkin", {
        id, name, week: week.no, code, openBeforeMinutes, lateAfterMinutes, alwaysOpen: Boolean(alwaysOpen),
        start: week.start.getTime(), end: week.end.getTime(),
      });
    },
    async submit({ id, name, week, file, allowLate }) {
      return remote("submit", {
        id, name, week: week.no, title: week.assignment.title, due: week.due.getTime(), allowLate,
        fileName: file.name, mimeType: file.type, data: await fileToBase64(file),
      });
    },
  };

  // admin.js 에서 함께 씁니다.
  window.SITE_DATA = { db, store, isLocal, PREFIX };

  // 버튼을 잠시 '처리 중' 상태로 바꿔 두고 작업을 실행합니다.
  const busy = async (btn, text, fn) => {
    const old = btn.textContent;
    btn.disabled = true;
    btn.textContent = text;
    try { return await fn(); }
    finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = old; } }
  };

  // ── 공통 도우미 ─────────────────────────────────────
  const toastEl = $("#toast");
  let toastTimer;
  const toast = (msg) => {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
  };
  window.SITE_DATA.toast = toast;

  // 받침에 따라 을/를 붙이기
  const eulreul = (word) => {
    const c = word.charCodeAt(word.length - 1);
    if (c < 0xac00 || c > 0xd7a3) return `${word}을(를)`;
    return word + ((c - 0xac00) % 28 ? "을" : "를");
  };
  const shortLabel = (label) => label.replace(/\s*\(.*\)\s*$/, "");
  const pad = (n) => String(n).padStart(2, "0");
  const hhmm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const fmtSize = (b) => (b >= 1048576 ? `${(b / 1048576).toFixed(1)}MB` : `${Math.max(1, Math.round(b / 1024))}KB`);

  // ════════════════════════════════════════════════════
  //  1. 실시간 투표
  // ════════════════════════════════════════════════════
  const P = C.poll;
  if (P) {
    $("#poll").innerHTML = `
      <div class="container">
        ${sectionHead(P.heading, P.lead)}
        <div class="poll-layout">
          <form class="card poll-form" novalidate>
            <fieldset>
              <legend class="card-title">하나를 골라 주세요</legend>
              <div class="poll-options">
                ${P.options.map((o) => `
                  <label class="poll-option">
                    <input type="radio" name="poll" value="${esc(o.id)}">
                    <span class="poll-icon" aria-hidden="true">${esc(o.icon)}</span>
                    <span class="poll-label">${esc(o.label)}</span>
                  </label>`).join("")}
              </div>
            </fieldset>
            <button class="btn btn-primary poll-submit" type="submit">투표하기</button>
            <p class="form-msg" role="alert"></p>
          </form>
          <div class="card poll-result">
            <div class="poll-result-head">
              <h3 class="card-title">투표 결과</h3>
              <span class="live"><i aria-hidden="true"></i>실시간</span>
            </div>
            <ul class="bars">
              ${P.options.map((o) => `
                <li data-id="${esc(o.id)}">
                  <div class="bar-label">
                    <span>${esc(o.icon)} ${esc(o.label)}<em class="mine-tag">내 선택</em></span>
                    <b class="bar-value"></b>
                  </div>
                  <div class="bar-track"><div class="bar-fill"></div></div>
                </li>`).join("")}
            </ul>
            <p class="poll-total"></p>
            ${localNote("투표는 이 브라우저에 저장되며, 같은 브라우저의 다른 탭에는 실시간으로 반영됩니다.")}
          </div>
        </div>
      </div>`;

    const form = $(".poll-form");
    const msg = $(".form-msg", form);

    let votes = {};
    const updatePoll = () => {
      const mine = store.get("poll:mine", null);
      const total = P.options.reduce((s, o) => s + (votes[o.id] || 0), 0);
      const max = Math.max(0, ...P.options.map((o) => votes[o.id] || 0));

      document.querySelectorAll(".bars li").forEach((li) => {
        const n = votes[li.dataset.id] || 0;
        const pct = total ? Math.round((n / total) * 100) : 0;
        li.classList.toggle("mine", li.dataset.id === mine);
        li.classList.toggle("top", max > 0 && n === max);
        $(".bar-value", li).textContent = `${n}표 · ${pct}%`;
        $(".bar-fill", li).style.width = `${pct}%`;
        li.setAttribute("aria-label", `${li.querySelector(".bar-label span").firstChild.textContent.trim()} ${n}표, ${pct}퍼센트`);
      });
      $(".poll-total").textContent = total ? `총 ${total}표` : "아직 투표가 없습니다. 첫 번째로 투표해 주세요!";

      form.querySelectorAll("input").forEach((inp) => {
        if (mine && inp.value === mine) inp.checked = true;
        inp.disabled = Boolean(mine) && !P.allowChange;
      });
      const btn = $(".poll-submit", form);
      btn.textContent = mine ? (P.allowChange ? "선택 바꾸기" : "투표 완료") : "투표하기";
      btn.disabled = Boolean(mine) && !P.allowChange;
    };

    const loadPoll = async () => {
      try {
        votes = await db.poll();
        updatePoll();
      } catch (err) {
        $(".poll-total").textContent = `결과를 불러오지 못했습니다. (${err.message})`;
      }
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const picked = form.querySelector("input:checked")?.value;
      const mine = store.get("poll:mine", null);
      msg.className = "form-msg";
      if (!picked) { msg.textContent = "주제를 하나 선택해 주세요."; msg.classList.add("error"); return; }
      if (picked === mine) { msg.textContent = "이미 이 주제에 투표하셨어요."; return; }

      try {
        votes = await busy($(".poll-submit", form), "저장 중…", () => db.vote(picked, mine));
        store.set("poll:mine", picked);
        msg.textContent = "";
        updatePoll();
        toast(mine ? "선택을 바꿨습니다." : "투표해 주셔서 감사합니다!");
      } catch (err) {
        msg.textContent = `투표를 저장하지 못했습니다. 잠시 후 다시 시도해 주세요. (${err.message})`;
        msg.classList.add("error");
        updatePoll();
      }
    });

    if (isLocal) {
      // 같은 브라우저의 다른 탭에서 투표하면 바로 반영
      window.addEventListener("storage", (e) => {
        if (e.key && e.key.startsWith(PREFIX + "poll:")) loadPoll();
      });
    } else {
      // 시트 연결 시: 화면을 보고 있는 동안 주기적으로 새 결과를 가져옵니다
      $(".poll-total").textContent = "결과를 불러오는 중…";
      setInterval(() => {
        if (document.visibilityState === "visible") loadPoll();
      }, Math.max(5, PC.pollRefreshSeconds || 15) * 1000);
    }
    updatePoll();
    loadPoll();
  }

  // ════════════════════════════════════════════════════
  //  2. 수강 신청서
  // ════════════════════════════════════════════════════
  const F = C.applyForm;
  if (F) {
    const applyEl = $("#apply");
    const fid = (f) => `f-${f.name}`;
    const autocomplete = { name: "name", email: "email", phone: "tel" };

    const fieldHTML = (f) => {
      const id = fid(f);
      const req = f.required ? `<span class="req" aria-hidden="true">*</span>` : "";
      const reqAttr = f.required ? ` aria-required="true"` : "";
      const err = `<p class="field-error" id="${id}-err"></p>`;
      const desc = ` aria-describedby="${id}-err"`;
      const ac = autocomplete[f.name] ? ` autocomplete="${autocomplete[f.name]}"` : "";

      if (f.type === "radio" || f.type === "checkboxes") {
        const t = f.type === "radio" ? "radio" : "checkbox";
        return `
          <fieldset class="field field-full" id="${id}" data-field="${f.name}" tabindex="-1"${desc}>
            <legend>${esc(f.label)}${req}</legend>
            <div class="choice-row">
              ${f.options.map((o) => `
                <label class="choice"><input type="${t}" name="${f.name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}
            </div>
            ${err}
          </fieldset>`;
      }
      if (f.type === "agree") {
        return `
          <div class="field field-full" data-field="${f.name}">
            <label class="agree"><input type="checkbox" id="${id}" name="${f.name}"${reqAttr}${desc}><span>${esc(f.label)}${req}</span></label>
            ${err}
          </div>`;
      }
      if (f.type === "select") {
        return `
          <div class="field" data-field="${f.name}">
            <label for="${id}">${esc(f.label)}${req}</label>
            <select id="${id}" name="${f.name}"${reqAttr}${desc}>
              <option value="">선택해 주세요</option>
              ${f.options.map((o) => `<option>${esc(o)}</option>`).join("")}
            </select>
            ${err}
          </div>`;
      }
      if (f.type === "textarea") {
        return `
          <div class="field field-full" data-field="${f.name}">
            <label for="${id}">${esc(f.label)}${req}</label>
            <textarea id="${id}" name="${f.name}" rows="5" placeholder="${esc(f.placeholder || "")}"${reqAttr}${desc}></textarea>
            <div class="field-foot">${err}<span class="counter" data-min="${f.minLength || 0}"></span></div>
          </div>`;
      }
      return `
        <div class="field" data-field="${f.name}">
          <label for="${id}">${esc(f.label)}${req}</label>
          <input id="${id}" name="${f.name}" type="${f.type === "email" || f.type === "tel" ? f.type : "text"}"
            placeholder="${esc(f.placeholder || "")}"${ac}${reqAttr}${desc}${f.type === "text" && f.pattern ? ' inputmode="numeric"' : ""}>
          ${err}
        </div>`;
    };

    const renderForm = () => {
      applyEl.innerHTML = `
        <div class="container">
          ${sectionHead(F.heading, F.lead)}
          <form class="card apply-form" novalidate>
            <div class="error-summary" tabindex="-1" role="alert" hidden></div>
            <div class="form-grid">${F.fields.map(fieldHTML).join("")}</div>
            <div class="form-actions">
              <button class="btn btn-primary btn-lg" type="submit">${esc(F.submitLabel)}</button>
            </div>
            ${localNote("신청서는 이 브라우저에만 저장되며 교수자에게 전송되지 않습니다.")}
          </form>
        </div>`;
      bindForm($(".apply-form", applyEl));
    };

    const renderSuccess = (data) => {
      const rows = F.fields
        .filter((f) => f.type !== "agree" && data[f.name] && data[f.name].length)
        .slice(0, 6)
        .map((f) => `<div><dt>${esc(shortLabel(f.label))}</dt><dd>${esc([].concat(data[f.name]).join(", "))}</dd></div>`)
        .join("");
      applyEl.innerHTML = `
        <div class="container">
          ${sectionHead(F.heading)}
          <div class="card apply-success">
            <div class="success-icon" aria-hidden="true">✓</div>
            <h3>${esc(F.successTitle)}</h3>
            <p>${esc(F.successText)}</p>
            <dl class="success-summary">${rows}</dl>
            <p class="muted">접수 시각 ${esc(fmtDateTime(new Date(data._at)))}</p>
            <button class="btn btn-ghost" type="button" id="apply-again">신청서 다시 작성하기</button>
          </div>
        </div>`;
      $("#apply-again").addEventListener("click", () => {
        renderForm();
        $(".apply-form input, .apply-form select")?.focus();
      });
    };

    const valueOf = (form, f) => {
      if (f.type === "checkboxes") return [...form.querySelectorAll(`[name="${f.name}"]:checked`)].map((i) => i.value);
      if (f.type === "radio") return form.querySelector(`[name="${f.name}"]:checked`)?.value || "";
      if (f.type === "agree") return form.querySelector(`[name="${f.name}"]`).checked;
      return form.querySelector(`[name="${f.name}"]`).value.trim();
    };

    const checkField = (form, f) => {
      const v = valueOf(form, f);
      const name = shortLabel(f.label);
      if (f.type === "checkboxes") return f.required && !v.length ? `${eulreul(name)} 하나 이상 선택해 주세요.` : "";
      if (f.type === "agree") return f.required && !v ? "개인정보 수집·이용에 동의해 주세요." : "";
      if (!v) return f.required ? `${eulreul(name)} ${f.type === "select" || f.type === "radio" ? "선택" : "입력"}해 주세요.` : "";
      if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) return "이메일 형식이 올바르지 않습니다. (예: name@korea.ac.kr)";
      if (f.pattern && !new RegExp(f.pattern).test(v)) return f.patternMessage || `${name} 형식을 확인해 주세요.`;
      if (f.minLength && v.length < f.minLength) return `${eulreul(name)} ${f.minLength}자 이상 입력해 주세요. (지금 ${v.length}자)`;
      return "";
    };

    const showError = (form, f, message) => {
      const wrap = form.querySelector(`[data-field="${f.name}"]`);
      wrap.classList.toggle("invalid", Boolean(message));
      $(`#${fid(f)}-err`).textContent = message;
      form.querySelectorAll(`[name="${f.name}"]`).forEach((el) => {
        if (message) el.setAttribute("aria-invalid", "true");
        else el.removeAttribute("aria-invalid");
      });
    };

    const bindForm = (form) => {
      const summary = $(".error-summary", form);
      let tried = false;

      const validateAll = () => {
        const errors = [];
        F.fields.forEach((f) => {
          const m = checkField(form, f);
          showError(form, f, m);
          if (m) errors.push({ f, m });
        });
        return errors;
      };

      const renderSummary = (errors) => {
        if (!errors.length) { summary.hidden = true; return; }
        summary.hidden = false;
        summary.innerHTML = `
          <strong>빠지거나 잘못된 항목이 ${errors.length}개 있어요</strong>
          <ul>${errors.map(({ f, m }) => `<li><a href="#${fid(f)}" data-target="${fid(f)}">${esc(m)}</a></li>`).join("")}</ul>`;
      };

      summary.addEventListener("click", (e) => {
        const a = e.target.closest("a[data-target]");
        if (!a) return;
        e.preventDefault();
        const el = document.getElementById(a.dataset.target);
        const focusable = el.matches("fieldset") ? el.querySelector("input") : el;
        el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
        focusable.focus({ preventScroll: true });
      });

      // 제출을 한 번 시도한 뒤에는 고칠 때마다 바로 다시 검사합니다.
      const recheck = (e) => {
        const name = e.target.name;
        const f = F.fields.find((x) => x.name === name);
        if (!f) return;
        if (f.type === "textarea") updateCounter(e.target, f);
        if (!tried) return;
        showError(form, f, checkField(form, f));
        renderSummary(F.fields.map((x) => ({ f: x, m: checkField(form, x) })).filter((x) => x.m));
      };
      form.addEventListener("input", recheck);
      form.addEventListener("change", recheck);

      const updateCounter = (ta, f) => {
        const c = ta.closest(".field").querySelector(".counter");
        const n = ta.value.trim().length;
        c.textContent = f.minLength ? `${n}자 / ${f.minLength}자 이상` : `${n}자`;
        c.classList.toggle("ok", n >= (f.minLength || 0));
      };
      F.fields.filter((f) => f.type === "textarea").forEach((f) => updateCounter(form.querySelector(`[name="${f.name}"]`), f));

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        tried = true;
        const errors = validateAll();
        renderSummary(errors);
        if (errors.length) {
          summary.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "center" });
          summary.focus({ preventScroll: true });
          return;
        }
        const data = { _at: Date.now() };
        F.fields.forEach((f) => { data[f.name] = valueOf(form, f); });
        try {
          await busy($('button[type="submit"]', form), "제출 중…", () => db.apply(data));
        } catch (err) {
          summary.hidden = false;
          summary.innerHTML = `<strong>신청서를 보내지 못했습니다</strong><ul><li>잠시 후 다시 시도해 주세요. (${esc(err.message)})</li></ul>`;
          summary.focus();
          return;
        }
        store.set("apply:last", data);
        renderSuccess(data);
        applyEl.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        toast("신청서가 접수되었습니다!");
      });
    };

    const last = store.get("apply:last", null);
    if (last) renderSuccess(last);
    else renderForm();
  }

  // ════════════════════════════════════════════════════
  //  3. 학습자 공간: 로그인 · 실시간 퀴즈 · 출석 · 과제 제출
  // ════════════════════════════════════════════════════
  const ST = C.student;
  if (ST) {
    const el = $("#student");
    const AT = ST.attendance || {};
    const UP = ST.upload || {};
    const assignments = weeks.filter((w) => w.assignment);
    const allowedExt = (UP.accept || "").split(",").map((s) => s.trim().toLowerCase()).filter(Boolean);

    const user = () => store.get("user", null);
    let me = { attendance: {}, submissions: {} }; // 로그인한 수강생의 기록 (db.student 로 불러옴)
    const attendance = () => me.attendance;
    const submissions = () => me.submissions;

    // 기록을 불러온 뒤 대시보드를 그립니다.
    const loadDashboard = async () => {
      el.innerHTML = `
        <div class="container">
          ${sectionHead(ST.heading, ST.lead)}
          <div class="card loading-card" role="status">기록을 불러오는 중…</div>
        </div>`;
      try {
        me = await db.student(user().id, user().name);
        renderDashboard();
      } catch (err) {
        el.querySelector(".loading-card").innerHTML = `
          <p>기록을 불러오지 못했습니다. (${esc(err.message)})</p>
          <div class="loading-actions">
            <button class="btn btn-primary btn-sm" type="button" id="retry-btn">다시 시도</button>
            <button class="btn btn-ghost btn-sm" type="button" id="logout-btn">로그아웃</button>
          </div>`;
        $("#retry-btn").addEventListener("click", loadDashboard);
        $("#logout-btn").addEventListener("click", logout);
      }
    };

    // 지금 출석할 수 있는 주차
    const openWeek = () => {
      const now = new Date();
      if (AT.alwaysOpen) return weeks.find((w) => w.end >= now && !attendance()[w.no]) || null;
      return weeks.find((w) => now >= new Date(w.start - (AT.openBeforeMinutes || 0) * 6e4) && now <= w.end) || null;
    };
    const attStatus = (w, rec) => {
      if (rec) return rec.late ? { cls: "late", label: "지각" } : { cls: "present", label: "출석" };
      if (w.end < new Date()) return { cls: "absent", label: "미출석" };
      if (w.key === dateKey(new Date())) return { cls: "today", label: "오늘" };
      return { cls: "upcoming", label: "예정" };
    };

    // ── 실시간 퀴즈 카드 ──
    // 교수자가 관리자 화면에서 문항을 열면, 몇 초마다 상태를 확인해 바로 보여 줍니다.
    const QZ = C.quiz;
    const quizQs = () => (QZ?.questions || []).map((q, i) => ({ ...q, id: String(q.id || `q${i + 1}`) }));
    let quizTimer = null;
    let quizKey = "";
    let quizCurrent = null;
    const stopQuiz = () => { clearInterval(quizTimer); quizTimer = null; quizKey = ""; };

    const renderQuiz = (card, st) => {
      const body = $(".quiz-body", card);
      const qs = quizQs();
      const qi = qs.findIndex((x) => x.id === st.openId);
      const q = qs[qi];
      quizCurrent = q || null;
      if (!q) {
        body.innerHTML = `<p class="quiz-wait">지금 진행 중인 퀴즈가 없어요.<small>수업 중 교수자가 퀴즈를 열면 여기에 바로 나타납니다.</small></p>`;
        return;
      }
      const ans = Number(q.answer) - 1;
      const answered = st.mine != null && st.mine !== "";
      const mine = answered ? Number(st.mine) : null;
      const total = Number(st.total) || 0;
      const opts = (q.options || []).map((o, i) => {
        const n = Number(st.counts?.[i]) || 0;
        const pct = total ? Math.round((n / total) * 100) : 0;
        const cls = st.reveal ? (i === ans ? "correct" : i === mine ? "wrong" : "") : i === mine ? "picked" : "";
        const inner = `
          ${st.reveal ? `<span class="qo-bar" style="width:${pct}%"></span>` : ""}
          <span class="qo-no">${i + 1}</span><span class="qo-text">${esc(o)}</span>
          ${st.reveal ? `<span class="qo-count">${n}명 · ${pct}%</span>` : i === mine ? `<span class="qo-count">내 답</span>` : ""}`;
        return answered || st.reveal
          ? `<div class="quiz-opt ${cls}">${inner}</div>`
          : `<button class="quiz-opt" type="button" data-choice="${i}">${inner}</button>`;
      }).join("");
      let msg;
      if (st.reveal) {
        msg = !answered ? `<p class="quiz-msg">정답은 <b>${ans + 1}번</b>입니다. (이 문항에는 답하지 않았어요)</p>`
          : mine === ans ? `<p class="quiz-msg good">🎉 정답입니다!</p>`
          : `<p class="quiz-msg bad">아쉬워요. 정답은 <b>${ans + 1}번</b>입니다.</p>`;
      } else if (answered) {
        msg = `<p class="quiz-msg">✅ 답을 제출했어요. 교수자가 정답을 공개할 때까지 기다려 주세요. <small>지금까지 ${total}명 응답</small></p>`;
      } else {
        msg = `<p class="quiz-msg">보기를 눌러 답을 고르세요. 한 번 고르면 바꿀 수 없어요.</p>`;
      }
      body.innerHTML = `
        <p class="quiz-q"><span class="quiz-badge">Q${qi + 1}</span>${esc(q.question)}</p>
        <div class="quiz-opts">${opts}</div>
        ${msg}
        ${st.reveal && q.explanation ? `<p class="quiz-exp">💡 ${esc(q.explanation)}</p>` : ""}`;
    };

    const refreshQuiz = async () => {
      const card = $("#quiz-card");
      if (!card || !user()) { stopQuiz(); return; }
      let st;
      try {
        st = await db.quizState(user().id);
      } catch (err) {
        $(".quiz-body", card).innerHTML = `<p class="quiz-wait">퀴즈 상태를 확인하지 못했습니다.<small>${esc(err.message)}</small></p>`;
        quizKey = "";
        return;
      }
      const key = JSON.stringify(st);
      if (key === quizKey) return; // 바뀐 게 없으면 화면을 그대로 둡니다
      quizKey = key;
      renderQuiz(card, st);
    };

    const startQuiz = () => {
      stopQuiz();
      const card = $("#quiz-card");
      if (!card) return;
      card.addEventListener("click", async (e) => {
        const b = e.target.closest("[data-choice]");
        if (!b || !quizCurrent) return;
        const choice = Number(b.dataset.choice);
        card.querySelectorAll("[data-choice]").forEach((x) => { x.disabled = true; });
        try {
          await db.quizAnswer({ id: user().id, name: user().name, qid: quizCurrent.id, choice, correct: choice === Number(quizCurrent.answer) - 1 });
          toast("답을 제출했어요.");
        } catch (err) {
          toast(err.message);
        }
        quizKey = "";
        refreshQuiz();
      });
      refreshQuiz();
      quizTimer = setInterval(refreshQuiz, Math.max(2, Number(QZ?.refreshSeconds) || 5) * 1000);
    };

    // ── 헤더의 로그인 버튼 / 로그인한 이름 ──
    const headerUser = $("#header-user");
    const loginDlg = $("#student-login");

    const renderHeaderUser = () => {
      if (!headerUser) return;
      const u = user();
      headerUser.innerHTML = u
        ? `<a class="hu-name" href="#student" title="학습자 공간으로 이동" aria-label="${esc(u.name)}님 · 학습자 공간으로 이동">
             <span class="hu-avatar" aria-hidden="true">${esc(u.name.charAt(0))}</span><span class="hu-text">${esc(u.name)}님</span>
           </a>
           <button class="hu-btn" type="button" data-act="logout">로그아웃</button>`
        : `<button class="hu-btn hu-login" type="button" data-act="login" aria-label="학습자 로그인" title="학습자 로그인">
             <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-2.8-3.6-5-8-5Z"/></svg>
             <span>학습자 로그인</span>
           </button>`;
    };
    headerUser?.addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "login") openLogin();
      if (act === "logout") logout();
    });

    const logout = () => {
      store.remove("user");
      me = { attendance: {}, submissions: {} };
      renderLogin();
      renderHeaderUser();
      toast("로그아웃되었습니다.");
    };

    // 학습자 공간: 로그인 전에는 안내와 로그인 버튼만 보여 줍니다.
    const renderLogin = () => {
      stopQuiz();
      el.innerHTML = `
        <div class="container">
          ${sectionHead(ST.heading, ST.lead)}
          <div class="card login-card">
            <div class="login-icon" aria-hidden="true">🔐</div>
            <h3>학습자 로그인이 필요해요</h3>
            <p class="login-hint">출석 체크와 과제 제출은 로그인한 뒤 이용할 수 있어요.<br>화면 위쪽의 <b>학습자 로그인</b> 버튼을 눌러도 됩니다.</p>
            <button class="btn btn-primary btn-lg" type="button" id="open-login-btn">로그인하기</button>
          </div>
        </div>`;
      $("#open-login-btn").addEventListener("click", openLogin);
    };

    const openLogin = () => {
      if (!loginDlg) return;
      loginDlg.innerHTML = `
        <form class="admin-login-form" novalidate>
          <div class="popup-art" aria-hidden="true">🎓</div>
          <h2 id="student-login-title">학습자 로그인</h2>
          <div class="field">
            <label for="login-id">학번<span class="req" aria-hidden="true">*</span></label>
            <input id="login-id" name="id" inputmode="numeric" autocomplete="username" placeholder="2025123456" aria-describedby="login-id-err">
            <p class="field-error" id="login-id-err"></p>
          </div>
          <div class="field">
            <label for="login-name">이름<span class="req" aria-hidden="true">*</span></label>
            <input id="login-name" name="name" autocomplete="name" placeholder="홍길동" aria-describedby="login-name-err">
            <p class="field-error" id="login-name-err"></p>
          </div>
          <div class="admin-login-actions">
            <button class="btn btn-ghost" type="button" data-close>취소</button>
            <button class="btn btn-primary" type="submit">로그인</button>
          </div>
          ${localNote("학번·이름은 이 브라우저에만 저장되며, 비밀번호 확인 없이 이름표처럼 사용됩니다.")}
          ${isLocal ? "" : `<p class="local-note">ℹ️ 비밀번호 없이 학번·이름으로 기록을 구분합니다. 다른 사람의 학번으로 로그인하지 마세요.</p>`}
        </form>`;
      $("[data-close]", loginDlg).addEventListener("click", () => loginDlg.close());
      const form = $("form", loginDlg);
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const id = $("#login-id").value.trim();
        const name = $("#login-name").value.trim();
        const errs = {
          id: !id ? "학번을 입력해 주세요." : !/^\d{10}$/.test(id) ? "학번은 숫자 10자리로 입력해 주세요." : "",
          name: !name ? "이름을 입력해 주세요." : "",
        };
        Object.entries(errs).forEach(([k, m]) => {
          $(`#login-${k}-err`).textContent = m;
          $(`#login-${k}`).toggleAttribute("aria-invalid", Boolean(m));
          $(`#login-${k}`).closest(".field").classList.toggle("invalid", Boolean(m));
        });
        const firstBad = Object.keys(errs).find((k) => errs[k]);
        if (firstBad) { $(`#login-${firstBad}`).focus(); return; }
        try {
          me = await busy($('button[type="submit"]', form), "확인 중…", () => db.student(id, name));
        } catch (err) {
          $("#login-id-err").textContent = err.message;
          $("#login-id").closest(".field").classList.add("invalid");
          $("#login-id").focus();
          return;
        }
        store.set("user", { id, name });
        loginDlg.close();
        renderDashboard();
        renderHeaderUser();
        el.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
        toast(`${name}님, 환영합니다!`);
      });
      loginDlg.showModal();
      $("#login-id").focus();
    };

    const renderDashboard = () => {
      const u = user();
      const att = attendance();
      const subs = submissions();
      const ended = weeks.filter((w) => w.end < new Date() || att[w.no]);
      const attended = weeks.filter((w) => att[w.no]).length;
      const submitted = assignments.filter((w) => subs[w.no]).length;
      const target = openWeek();
      const now = new Date();
      const nextClass = weeks.find((w) => w.end >= now);
      const defaultTask = assignments.find((w) => w.due >= now && !subs[w.no]) || assignments.find((w) => w.due >= now) || assignments[assignments.length - 1];

      let checkin;
      if (target && att[target.no]) {
        checkin = `<p class="checkin-state done">✅ ${target.no}주차 ${att[target.no].late ? "지각" : "출석"} 처리됨 · ${hhmm(new Date(att[target.no].at))}</p>
                   <button class="btn btn-disabled btn-lg" type="button" disabled>출석 완료</button>`;
      } else if (target) {
        checkin = `<p class="checkin-state open">지금 <strong>${target.no}주차 · ${esc(target.title)}</strong> 출석을 체크할 수 있어요.</p>
                   ${AT.askCode ? `
                   <div class="field code-field">
                     <label for="att-code">출석 코드</label>
                     <input id="att-code" autocomplete="off" placeholder="수업 시간에 안내된 코드" aria-describedby="att-code-err">
                   </div>` : ""}
                   <p class="field-error" id="att-code-err"></p>
                   <button class="btn btn-primary btn-lg" type="button" id="checkin-btn" data-week="${target.no}">출석 체크하기</button>`;
      } else {
        const opensAt = nextClass ? new Date(nextClass.start - (AT.openBeforeMinutes || 0) * 6e4) : null;
        checkin = `<p class="checkin-state">지금은 출석 시간이 아닙니다.${opensAt ? `<br>다음 출석: <strong>${nextClass.no}주차 · ${fmtDate(opensAt)} ${hhmm(opensAt)}부터</strong>` : ""}</p>
                   <button class="btn btn-disabled btn-lg" type="button" disabled>출석 체크하기</button>`;
      }

      el.innerHTML = `
        <div class="container">
          ${sectionHead(ST.heading, ST.lead)}
          <div class="card student-top">
            <div class="student-who">
              <span class="student-avatar" aria-hidden="true">${esc(u.name.charAt(0))}</span>
              <div><strong>${esc(u.name)}님</strong><small>${esc(u.id)}</small></div>
            </div>
            <dl class="student-stats">
              <div><dt>출석</dt><dd>${attended}<small> / ${ended.length}회</small></dd></div>
              <div><dt>과제 제출</dt><dd>${submitted}<small> / ${assignments.length}개</small></dd></div>
            </dl>
            <button class="btn btn-ghost btn-sm" type="button" id="logout-btn">로그아웃</button>
          </div>

          ${QZ ? `
          <div class="card quiz-card" id="quiz-card">
            <div class="quiz-head">
              <h3 class="card-title">🧠 ${esc(QZ.heading || "실시간 퀴즈")}</h3>
              <span class="quiz-live"><i aria-hidden="true"></i>실시간</span>
            </div>
            <div class="quiz-body" aria-live="polite"><p class="quiz-wait">불러오는 중…</p></div>
          </div>` : ""}

          <div class="student-grid">
            <div class="card">
              <h3 class="card-title">출석 체크</h3>
              <div class="checkin">${checkin}</div>
              <ol class="att-grid" aria-label="주차별 출석 현황">
                ${weeks.map((w) => {
                  const s = attStatus(w, att[w.no]);
                  return `<li class="att-${s.cls}" title="${w.no}주차 ${fmtDate(w.date)} · ${s.label}"><b>${w.no}</b><small>${s.label}</small></li>`;
                }).join("")}
              </ol>
              <ul class="cal-legend att-legend">
                <li><i class="att-present"></i>출석</li><li><i class="att-late"></i>지각</li>
                <li><i class="att-absent"></i>미출석</li><li><i class="att-upcoming"></i>예정</li>
              </ul>
            </div>

            <div class="card">
              <h3 class="card-title">과제 제출</h3>
              <form class="upload-form" novalidate>
                <div class="field">
                  <label for="task-select">과제 선택</label>
                  <select id="task-select" name="week">
                    ${assignments.map((w) => `<option value="${w.no}"${w === defaultTask ? " selected" : ""}>${w.no}주차 · ${esc(w.assignment.title)}${subs[w.no] ? " ✓" : ""}</option>`).join("")}
                  </select>
                </div>
                <div class="task-info"></div>
                <label class="dropzone" for="task-file">
                  <input type="file" id="task-file" name="file" accept="${esc(UP.accept || "")}" aria-describedby="file-err file-hint">
                  <span class="dz-icon" aria-hidden="true">📎</span>
                  <span class="dz-text"><strong>파일을 끌어다 놓거나 눌러서 선택</strong><small id="file-hint">${esc(allowedExt.join(", "))} · 최대 ${UP.maxSizeMB || 20}MB</small></span>
                </label>
                <p class="field-error" id="file-err"></p>
                <button class="btn btn-primary" type="submit">제출하기</button>
              </form>
              <ul class="sub-list">
                ${assignments.map((w) => {
                  const s = subs[w.no];
                  const state = s ? (s.late ? ["late", "지각 제출"] : ["done", "제출 완료"]) : w.due < now ? ["missed", "미제출 · 마감"] : ["todo", "미제출"];
                  return `
                    <li class="sub-${state[0]}">

      const n = 46 + Math.floor(Math.random() * 20);
      const power = 2.4 + Math.random() * 2.2;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const sp = power * (0.6 + Math.random() * 0.5);

          x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,

          color: Math.random() < 0.75 ? r.color : pick(),
        });
      }

    [0, 380, 760, 1150, 1500, 1900].forEach((t) => setTimeout(fire, t));

    let last = startAt;

    const frame = (now) => {
      const k = Math.min((now - last) / 16.67, 3);
      last = now;
      ctx.clearRect(0, 0, innerWidth, innerHeight);

      for (let i = rockets.length - 1; i >= 0; i--) {
        const r = rockets[i];
        const px = r.x, py = r.y;
        r.x += r.vx * k; r.y += r.vy * k; r.vy += G * k;

        ctx.beginPath(); ctx.moveTo(px, py + 10); ctx.lineTo(r.x, r.y); ctx.stroke();
        if (r.vy >= -0.6) { explode(r); rockets.splice(i, 1); }

      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        const px = s.x, py = s.y;
        s.vx *= Math.pow(0.97, k); s.vy = s.vy * Math.pow(0.97, k) + 0.05 * k;
        s.x += s.vx * k; s.y += s.vy * k; s.life -= s.decay * k;
        if (s.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.min(1, s.life * 1.4);
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.2 + s.life * 2.2;
        ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(s.x, s.y); ctx.stroke();
        ctx.globalAlpha = 1;
      }

      if (now - startAt < 2200 || rockets.length || sparks.length) requestAnimationFrame(frame);
      else { window.removeEventListener("resize", resize); canvas.remove(); }
    };
    requestAnimationFrame(frame);
  }
});

  const loginDlg = $("#admin-login");
  const panel = $("#admin-panel");
  let fails = 0;
  let lockedUntil = 0;

  const openLogin = () => {
    if (session.get()) { openPanel(); return; }
    loginDlg.innerHTML = `
      <form class="admin-login-form" novalidate>
        <div class="popup-art" aria-hidden="true">🔐</div>
        <h2 id="admin-login-title">관리자 로그인</h2>
        <div class="field">
          <label for="admin-pw">비밀번호</label>
          <div class="pw-row">
            <input id="admin-pw" type="password" autocomplete="current-password" aria-describedby="admin-pw-err">
            <button class="pw-toggle" type="button" aria-label="비밀번호 보기" aria-pressed="false">보기</button>
          </div>
          <p class="field-error" id="admin-pw-err" role="alert"></p>
        </div>
        <div class="admin-login-actions">
          <button class="btn btn-ghost" type="button" data-close>취소</button>
          <button class="btn btn-primary" type="submit">열기</button>
        </div>
      </form>`;
    const form = $(".admin-login-form", loginDlg);
    const input = $("#admin-pw");
    const err = $("#admin-pw-err");
    $(".pw-toggle", loginDlg).addEventListener("click", (e) => {
      const show = input.type === "password";
      input.type = show ? "text" : "password";
      e.currentTarget.textContent = show ? "숨기기" : "보기";
      e.currentTarget.setAttribute("aria-pressed", String(show));
    });
    $("[data-close]", loginDlg).addEventListener("click", () => loginDlg.close());
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!window.crypto?.subtle) { err.textContent = "이 브라우저 환경에서는 비밀번호를 확인할 수 없습니다. (https 주소나 파일로 열어 주세요)"; return; }
      const wait = Math.ceil((lockedUntil - Date.now()) / 1000);
      if (wait > 0) { err.textContent = `잠시 후 다시 시도해 주세요. (${wait}초)`; return; }
      if (!input.value) { err.textContent = "비밀번호를 입력해 주세요."; input.focus(); return; }
      const btn = $('button[type="submit"]', form);
      btn.disabled = true;
      btn.textContent = "확인 중…";
      const ok = await verify(input.value);
      btn.disabled = false;
      btn.textContent = "열기";
      if (!ok) {
        fails += 1;
        if (fails >= 5) { lockedUntil = Date.now() + 30000; fails = 0; err.textContent = "5번 틀렸습니다. 30초 뒤에 다시 시도해 주세요."; }
        else err.textContent = "비밀번호가 맞지 않습니다.";
        input.select();
        input.setAttribute("aria-invalid", "true");
        return;
      }
      fails = 0;
      session.set({ pw: input.value, tab: "edit" });
      loginDlg.close();
      openPanel();
    });
    loginDlg.showModal();
    input.focus();
  };

  $("#admin-lock").addEventListener("click", openLogin);

  // ════════════════════════════════════════════════════
  //  관리자 화면
  // ════════════════════════════════════════════════════
  const TABS = [
    ["edit", "✏️ 사이트 편집"],
    ["notices", "📢 공지"],
    ["quiz", "🧠 퀴즈"],
    ["roster", "👥 수강생 명단"],
    ["attendance", "✅ 출석"],
    ["tasks", "🗓️ 주차별 과제"],
    ["submissions", "📝 과제 제출"],
    ["applications", "📋 수강 신청"],
    ["file", "💾 설정 파일"],
    ["password", "🔑 비밀번호"],
    ["ai", "🤖 AI API 키"],
  ];
  let draft = clone(C);
  let dirty = false;
  let current = "edit";
  let cache = null; // 관리자 데이터 (명단·출석·과제·신청)
  const pw = () => session.get()?.pw || "";

  const openPanel = () => {
    const s = session.get();
    if (s?.tab) current = s.tab;
    cache = null; // 열 때마다 최신 내역을 다시 불러옵니다
    panel.innerHTML = `
      <div class="ap-shell">
        <header class="ap-head">
          <div>
            <h2 id="admin-title">관리자 화면</h2>
            <span class="ap-mode ${isLocal ? "" : "on"}">${isLocal ? "체험 모드 · 이 브라우저의 데이터" : "Google 시트 연결됨"}</span>
          </div>
          <div class="ap-head-actions">
            <button class="btn btn-ghost btn-sm" type="button" id="ap-lock">잠그기</button>
            <button class="ap-x" type="button" id="ap-close" aria-label="관리자 화면 닫기">×</button>
          </div>
        </header>
        <div class="ap-dirty" hidden>
          <span>저장하지 않은 편집 내용이 있습니다.</span>
          <button class="btn btn-ghost btn-sm" type="button" data-act="discard">되돌리기</button>
          <button class="btn ${isLocal ? "btn-primary" : "btn-ghost"} btn-sm" type="button" data-act="apply">미리보기 적용</button>
          ${isLocal ? "" : `<button class="btn btn-primary btn-sm" type="button" data-act="publish">💾 저장</button>`}
        </div>
        <nav class="ap-tabs" role="tablist" aria-label="관리 메뉴">
          ${TABS.map(([id, label]) => `<button type="button" role="tab" id="tab-${id}" data-tab="${id}" aria-controls="ap-body">${label}</button>`).join("")}
        </nav>
        <div class="ap-body" id="ap-body" role="tabpanel" tabindex="-1"></div>
      </div>`;

    $("#ap-close").addEventListener("click", closePanel);
    $("#ap-lock").addEventListener("click", () => {
      session.clear();
      panel.close();
      editShortcuts();
      toast("관리자 화면을 잠갔습니다.");
    });
    editShortcuts();
    panel.querySelector(".ap-tabs").addEventListener("click", (e) => {
      const b = e.target.closest("[data-tab]");
      if (b) showTab(b.dataset.tab);
    });
    panel.querySelector(".ap-dirty").addEventListener("click", (e) => {
      const act = e.target.closest("[data-act]")?.dataset.act;
      if (act === "apply") applyDraft();
      if (act === "publish") publishConfig(draft, e.target);
      if (act === "discard" && confirm("편집한 내용을 모두 되돌릴까요?")) { draft = clone(C); setDirty(false); showTab(current); }
    });
    panel.oncancel = (e) => { e.preventDefault(); closePanel(); };
    if (!panel.open) panel.showModal();
    showTab(current);
  };

  // ── 저장: Google 시트의 '사이트설정' 탭에 넣어 모든 방문자에게 반영합니다 ──
  const SITE_CACHE_KEY = "ffp:siteConfig";
  const publishConfig = async (cfg, btn) => {
    if (isLocal) { alert(`체험 모드에서는 저장할 곳이 없습니다. 💾 설정 파일 탭에서 ${DEPLOY} 를 내려받아 사이트에 올려 주세요.`); return false; }
    const config = clone(cfg);
    delete config.participation; // 저장 방식은 항상 config.js 의 값을 씁니다
    const old = btn?.textContent;
    if (btn) { btn.disabled = true; btn.textContent = "저장 중…"; }
    try {
      const r = await db.saveSiteConfig(pw(), config);
      try {
        localStorage.setItem(SITE_CACHE_KEY, JSON.stringify({ config, savedAt: r.savedAt }));
        localStorage.removeItem(OVERRIDE_KEY); // 저장했으니 이 브라우저의 미리보기는 필요 없습니다
      } catch { /* 저장 공간 없음 */ }
    } catch (err) {
      if (btn?.isConnected) { btn.disabled = false; btn.textContent = old; }
      alert(`저장하지 못했습니다: ${err.message}`);
      return false;
    }
    session.set({ ...session.get(), tab: current, reopen: true });
    toast("저장했습니다. 모든 방문자에게 반영됩니다.");
    location.reload();
    return true;
  };

  // 관리자로 들어와 있는 동안 '과제 및 평가' 섹션에 바로 고치기 버튼을 보여 줍니다.
  const SHORTCUTS = [["enroll", "enroll", "✏️ 평가 항목 수정"], ["materials", "materials", "✏️ 자료 수정"]];
  const editShortcuts = () => {
    SHORTCUTS.forEach(([secId, key, text]) => {
      const head = $(`#${secId} .section-head`);
      if (!head) return;
      let b = $(".admin-edit-btn", head);
      if (!session.get()) { b?.remove(); return; }
      if (b) return;
      b = document.createElement("button");
      b.type = "button";
      b.className = "btn btn-ghost btn-sm admin-edit-btn";
      b.textContent = text;
      b.addEventListener("click", () => {
        editSection = key in draft ? key : "site";
        session.set({ ...session.get(), tab: "edit" });
        openPanel();
      });
      head.append(b);
    });
  };

  const closePanel = () => {
    if (dirty && !confirm("적용하지 않은 편집 내용이 있습니다. 그래도 닫을까요? (다시 열면 이어서 편집할 수 있습니다)")) return;
    panel.close();
  };
  panel.addEventListener("close", () => clearInterval(quizAdminTimer));

  // ════════════════════════════════════════════════════
  //  탭. 실시간 퀴즈 진행 (진행하기 → 정답 공개 → 종료)
  // ════════════════════════════════════════════════════
  let quizAdminTimer = null;
  const tabQuiz = (body) => {
    const qs = (C.quiz?.questions || []).map((q, i) => ({ ...q, id: String(q.id || `q${i + 1}`) }));
    body.innerHTML = `
      ${toolbar("실시간 퀴즈", `
        <button class="btn btn-ghost btn-sm" type="button" data-act="edit-q">✏️ 문항 편집</button>
        <button class="btn btn-ghost btn-sm" type="button" data-act="refresh">새로고침</button>`)}
      <p class="ap-help">문항의 <b>진행하기</b>를 누르면 학습자 공간에 바로 나타납니다. 응답이 모이면 <b>정답 공개</b>, 끝나면 <b>종료</b>를 누르세요.
        한 번에 한 문항만 진행됩니다. 응답 현황은 몇 초마다 자동으로 새로 고쳐집니다.
        ${isLocal ? "<br>체험 모드에서는 이 브라우저 안에서만 동작합니다. 같은 브라우저의 다른 탭에서 학습자로 로그인해 시험해 볼 수 있습니다." : ""}</p>
      <div class="quiz-admin-list"><p class="ap-loading">불러오는 중…</p></div>`;
    const list = $(".quiz-admin-list", body);
    if (!qs.length) {
      list.innerHTML = `<p class="muted">문항이 없습니다. <b>✏️ 문항 편집</b>에서 만들어 주세요.</p>`;
      return;
    }

    let lastKey = "";
    const load = async (force) => {
      if (!body.isConnected) { clearInterval(quizAdminTimer); return; }
      let data;
      try { data = await db.quizResults(pw()); }
      catch (x) { list.innerHTML = `<p class="ap-error">퀴즈 현황을 불러오지 못했습니다: ${esc(x.message)}</p>`; lastKey = ""; return; }
      const key = JSON.stringify(data);
      if (!force && key === lastKey) return;
      lastKey = key;
      const st = data.state || {};
      list.innerHTML = qs.map((q, qi) => {
        const r = (data.results || {})[q.id] || { counts: {}, total: 0 };
        const total = Number(r.total) || 0;
        const ans = Number(q.answer) - 1;
        const open = st.openId === q.id;
        const chip = open ? (st.reveal ? `<span class="notice-tag is-popup">정답 공개 중</span>` : `<span class="notice-tag is-pin">진행 중</span>`) : "";
        const bars = (q.options || []).map((o, i) => {
          const n = Number(r.counts?.[i]) || 0;
          const pct = total ? Math.round((n / total) * 100) : 0;
          return `
            <li class="${i === ans ? "is-answer" : ""}">
              <span class="qa-label">${i + 1}. ${esc(o)}${i === ans ? " ✔" : ""}</span>
              <span class="qa-track"><span style="width:${pct}%"></span></span>
              <span class="qa-num">${n}명</span>
            </li>`;
        }).join("");
        const btns = open
          ? `${st.reveal ? "" : `<button class="btn btn-primary btn-sm" type="button" data-act="reveal" data-id="${esc(q.id)}">정답 공개</button>`}
             <button class="btn btn-ghost btn-sm" type="button" data-act="close">종료</button>`
          : `<button class="btn btn-primary btn-sm" type="button" data-act="open" data-id="${esc(q.id)}">진행하기</button>`;
        return `
          <div class="ap-card quiz-admin-item${open ? " is-open" : ""}">
            <h4>Q${qi + 1}. ${esc(q.question)} ${chip}</h4>
            <ul class="qa-bars">${bars}</ul>
            <p class="muted">응답 ${total}명${total ? ` · 정답률 ${Math.round(((Number(r.counts?.[ans]) || 0) / total) * 100)}%` : ""}</p>
            <div class="ai-actions">
              ${btns}
              <button class="btn btn-ghost btn-sm" type="button" data-act="reset" data-id="${esc(q.id)}"${total ? "" : " disabled"}>응답 초기화</button>
            </div>
          </div>`;
      }).join("");
    };

    body.addEventListener("click", async (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) return;
      const act = b.dataset.act;
      const id = b.dataset.id;
      if (act === "edit-q") { editSection = "quiz" in draft ? "quiz" : "site"; showTab("edit"); return; }
      try {
        b.disabled = true;
        if (act === "open") { await db.quizControl(pw(), { openId: id, reveal: false }); toast("문항을 열었습니다. 학습자 화면에 곧 나타납니다."); }
        if (act === "reveal") { await db.quizControl(pw(), { openId: id, reveal: true }); toast("정답을 공개했습니다."); }
        if (act === "close") { await db.quizControl(pw(), { openId: "", reveal: false }); toast("퀴즈를 종료했습니다."); }
        if (act === "reset") {
          if (!confirm("이 문항의 응답을 모두 지울까요? 되돌릴 수 없습니다.")) { b.disabled = false; return; }
          await db.quizReset(pw(), id);
          toast("응답을 지웠습니다.");
        }
      } catch (x) {
        toast(`처리하지 못했습니다: ${x.message}`);
      }
      load(true);
    });

    load(true);
    quizAdminTimer = setInterval(load, Math.max(2, Number(C.quiz?.refreshSeconds) || 5) * 1000);
  };

  const setDirty = (v) => {
    dirty = v;
    const bar = panel.querySelector(".ap-dirty");
    if (bar) bar.hidden = !v;
  };

  // 편집 내용을 이 브라우저에 저장하고 새로고침해서 바로 확인합니다.
  const applyDraft = () => {
    if (!saveOverride(draft)) { alert("브라우저 저장 공간에 저장하지 못했습니다."); return; }
    session.set({ ...session.get(), tab: current, reopen: true });
    location.reload();
  };

  const showTab = (id) => {
    current = id;
    session.set({ ...session.get(), tab: id });
    panel.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
    // 탭마다 새 영역을 만들어 이전 탭의 이벤트가 남지 않게 합니다.
    const old = $("#ap-body");
    const body = old.cloneNode(false);
    old.replaceWith(body);
    clearInterval(quizAdminTimer);
    ({ edit: tabEdit, notices: tabNotices, quiz: tabQuiz, roster: tabRoster, attendance: tabAttendance, tasks: tabTasks, submissions: tabSubmissions, applications: tabApplications, file: tabFile, password: tabPassword, ai: tabAI })[id](body);
  };

  // ── 공통: CSV 내려받기 ─────────────────────────────
  const csvCell = (v) => {
    let s = v == null ? "" : String(v);
    if (/^0\d+$/.test(s)) return `="${s}"`; // 010… 같은 번호의 맨 앞 0이 엑셀에서 사라지지 않도록
    if (/^[=+\-@]/.test(s)) s = `'${s}`; // 엑셀에서 수식으로 실행되지 않도록
    return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const toCSV = (rows) => rows.map((r) => r.map(csvCell).join(",")).join("\r\n");
  const download = (name, text, type) => {
    const isCsv = /\.csv$/.test(name);
    const blob = new Blob([isCsv ? "﻿" : "", text], { type: type || (isCsv ? "text/csv;charset=utf-8" : "text/javascript;charset=utf-8") });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  const tableHTML = (head, rows, opts = {}) => `
    <div class="ap-table-wrap">
      <table class="ap-table${opts.cls ? ` ${opts.cls}` : ""}">
        <thead><tr>${head.map((h) => `<th scope="col">${esc(h)}</th>`).join("")}</tr></thead>
        <tbody>${rows.length ? rows.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("") : `<tr><td colspan="${head.length}" class="empty">아직 내역이 없습니다.</td></tr>`}</tbody>
      </table>
    </div>`;

  // ── 공통: 관리자 데이터 불러오기 ─────────────────────
  const loadData = async (body, force) => {
    if (cache && !force) return cache;
    body.innerHTML = `<p class="ap-loading" role="status">내역을 불러오는 중…</p>`;
    try {
      const raw = await db.adminData(pw());
      cache = normalize(raw);
      return cache;
    } catch (err) {
      cache = null;
      body.innerHTML = `
        <div class="ap-error">
          <p><strong>내역을 불러오지 못했습니다.</strong><br>${esc(err.message)}</p>
          ${isLocal ? "" : `<p class="muted">시트 '설정' 탭의 관리자비밀번호가 이 사이트의 관리자 비밀번호와 같은지 확인해 주세요.</p>`}
          <button class="btn btn-primary btn-sm" type="button" data-retry>다시 시도</button>
        </div>`;
      body.querySelector("[data-retry]").addEventListener("click", () => showTab(current));
      return null;
    }
  };

  // 체험 모드와 시트 모드의 데이터 모양을 하나로 맞춥니다.
  const normalize = (raw) => {
    const roster = (raw.roster || []).map((s) => ({ id: String(s.id), name: s.name || "", email: s.email || "", memo: s.memo || "" }));
    let attendance = [];
    let submissions = [];
    let appHead = [];
    let applications = [];
    if (isLocal) {
      raw.attendance.forEach(([id, rec]) => Object.entries(rec).forEach(([week, r]) => attendance.push({ id, name: r.name || "", week: Number(week), at: r.at, late: r.late })));
      raw.submissions.forEach(([id, rec]) => Object.entries(rec).forEach(([week, r]) => submissions.push({
        id, name: r.name || "", week: Number(week), title: r.title || weeks[week - 1]?.assignment?.title || "",
        fileName: r.fileName, size: r.size, at: r.at, late: r.late, link: "",
      })));
      const fields = (C.applyForm?.fields || []);
      appHead = ["제출 시각", ...fields.map((f) => (f.type === "agree" ? "개인정보 동의" : f.label.replace(/\s*\(.*\)\s*$/, "")))];
      applications = raw.applications.map((a) => [fmtTime(a._at), ...fields.map((f) => {
        const v = a[f.name];
        return Array.isArray(v) ? v.join(", ") : v === true ? "동의" : v === false ? "" : v ?? "";
      })]);
    } else {
      attendance = raw.attendance.slice(1).map((r) => ({ at: r[0], id: String(r[1]), name: r[2], week: Number(r[3]), late: r[4] === "지각" }));
      submissions = raw.submissions.slice(1).map((r) => ({
        at: r[0], id: String(r[1]), name: r[2], week: Number(r[3]), title: r[4], fileName: r[5], size: Number(r[6]) * 1024, late: r[7] === "지각", link: r[8],
      }));
      appHead = (raw.applications[0] || ["제출 시각"]).map(String);
      applications = raw.applications.slice(1).map((r) => r.map((v, i) => (i === 0 ? fmtTime(v) : v)));
    }
    return { roster, attendance, submissions, appHead, applications };
  };

  const toolbar = (title, buttons) => `
    <div class="ap-toolbar">
      <h3>${title}</h3>
      <div class="ap-toolbar-actions">${buttons}</div>
    </div>`;

  // ════════════════════════════════════════════════════
  //  탭 1. 사이트 편집 (config 를 화면에서 바로 고치기)
  // ════════════════════════════════════════════════════
  const SECTIONS = [

    ["curriculum", "커리큘럼·주차"], ["schedule", "수업 일정"], ["poll", "투표"], ["tools", "AI 도구"],
    ["materials", "교재 및 참고자료"], ["enroll", "과제 및 평가"], ["applyForm", "수강생 정보"], ["faq", "FAQ"], ["instructor", "교수자"],
    ["footer", "하단"], ["popup", "안내 팝업"], ["welcome", "첫 방문 환영"], ["student", "학습자 공간"],

  const LABELS = {
