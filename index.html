<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예비교수자 과정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">본문 바로가기</a>

  <header class="site-header" id="top">
    <div class="header-inner">
      <a class="brand" href="#top" aria-label="맨 위로">
        <span class="brand-mark" aria-hidden="true">FF</span>
        <span class="brand-text">
          <strong data-bind="site.shortTitle"></strong>
          <small data-bind="site.organization"></small>
        </span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="주요 메뉴"></nav>
      <div class="header-tools">
        <button class="admin-lock" type="button" id="admin-lock" aria-label="관리자 화면 열기" title="관리자">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5Zm-3 5a3 3 0 1 1 6 0v3H9V7Zm3 7a1.5 1.5 0 0 1 .75 2.8V18a.75.75 0 0 1-1.5 0v-1.2A1.5 1.5 0 0 1 12 14Z"/></svg>
        </button>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="메뉴 열기">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="hero">
      <div class="container hero-inner">
        <!-- 제목 그림: 강단에서 AI 화면을 가리키며 강의하는 예비교수자 -->
        <div class="hero-art" aria-hidden="true">
          <svg viewBox="0 0 360 300" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <g stroke-width="2" opacity=".55">
              <path d="M22 14v14M15 21h14"/>
              <path d="M226 12v12M220 18h12"/>
              <path d="M344 112v12M338 118h12"/>
            </g>
            <rect x="20" y="40" width="220" height="140" rx="6" fill="currentColor" fill-opacity=".12"/>
            <g stroke-width="2" opacity=".7">
              <path d="M70 85 130 70M70 85 130 110M70 85 130 150M70 135 130 70M70 135 130 110M70 135 130 150"/>
              <path d="M130 70 190 95M130 110 190 95M130 150 190 95M130 70 190 135M130 110 190 135M130 150 190 135"/>
            </g>
            <g fill="currentColor">
              <circle cx="70" cy="85" r="7"/><circle cx="70" cy="135" r="7"/>
              <circle cx="130" cy="70" r="7"/><circle cx="130" cy="110" r="7"/><circle cx="130" cy="150" r="7"/>
              <circle cx="190" cy="95" r="7"/><circle cx="190" cy="135" r="7"/>
            </g>
            <path d="M130 180v35M105 238l25-23 25 23"/>
            <circle cx="275" cy="150" r="18" fill="currentColor" fill-opacity=".25"/>
            <path d="M245 232q0-52 30-54 30 2 30 54" fill="currentColor" fill-opacity=".18"/>
            <path d="M255 192 230 162"/>
            <path d="M230 162 206 136" stroke-width="2"/>
            <path d="M240 217h70l-8 75h-54z" fill="currentColor" fill-opacity=".22"/>
            <rect x="232" y="207" width="86" height="10" rx="2" fill="currentColor"/>
            <path d="M300 40l40 15-40 15-40-15z" fill="currentColor"/>
            <path d="M276 63v15q24 10 48 0V63"/>
            <path d="M340 55v24" stroke-width="2"/><circle cx="340" cy="82" r="3" fill="currentColor"/>
            <path d="M0 292h360" stroke-width="2" opacity=".4"/>
          </svg>
        </div>
        <p class="eyebrow" data-bind="site.badge"></p>
        <h1 data-bind="site.title"></h1>
        <p class="hero-subtitle" data-bind="site.subtitle"></p>
        <p class="hero-desc" data-bind="site.description"></p>
        <div class="hero-actions" id="hero-actions"></div>
      </div>
    </section>

    <div class="container key-info" id="key-info"></div>
    <section class="container notice-board" id="notice" hidden></section>

    <section class="section" id="about"></section>
    <section class="section section-tint" id="curriculum"></section>
    <section class="section" id="enroll"></section>
    <section class="section section-tint" id="tools"></section>
    <section class="section" id="schedule"></section>
    <section class="section section-tint" id="apply"></section>
    <section class="section" id="poll"></section>
    <section class="section section-tint" id="student"></section>
    <section class="section" id="faq"></section>
  </main>

  <footer class="site-footer" id="instructor"></footer>

  <button class="to-top" type="button" aria-label="맨 위로 이동">↑</button>

  <dialog class="popup" id="welcome-popup" aria-labelledby="popup-title"></dialog>
  <dialog class="popup notice-popup" id="notice-popup" aria-labelledby="notice-popup-title"></dialog>
  <dialog class="admin-login" id="admin-login" aria-labelledby="admin-login-title"></dialog>
  <dialog class="admin-panel" id="admin-panel" aria-labelledby="admin-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="participate.js"></script>
  <script src="admin.js"></script>
</body>
</html>
